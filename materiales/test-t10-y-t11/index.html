cial", "No se requiere informe previo en ningún caso"], "a": 1, "exp": "Requiere informe previo de la Abogacía del Estado, salvo razones de urgencia debidamente motivadas."}, {"lvl": "avanzado", "q": "Si el solicitante de tarjeta o certificado (aún no titular) pide informe, ¿a qué órgano puede someterse su examen?", "opts": ["A la Dirección del Servicio Jurídico del Estado o a la Abogacía del Estado en la provincia (a petición del interesado)", "Al Tribunal Supremo directamente, sin trámite administrativo previo", "Únicamente a la Comisaría Local del domicilio del solicitante", "No cabe ningún examen en este caso, al no ser aún titular"], "a": 0, "exp": "Distinción entre titular (informe previo obligatorio de la AE) y solicitante (examen a petición propia)."}, {"lvl": "avanzado", "q": "Si una resolución de expulsión se va a ejecutar más de 2 años después de haberse dictado, ¿qué debe hacerse?", "opts": ["Ejecutarla directamente sin más trámite adicional", "Comprobar y valorar posibles cambios de circunstancias y la amenaza actual que representa el interesado", "Anularla automáticamente por el mero transcurso del plazo", "Solicitar únicamente una nueva autorización judicial de ejecución"], "a": 1, "exp": "Debe revisarse la vigencia de la amenaza antes de ejecutar una expulsión con más de 2 años de antigüedad."}, {"lvl": "avanzado", "q": "¿Puede una resolución de expulsión de comunitario adoptarse con fines económicos?", "opts": ["Sí, si el extranjero carece de recursos económicos suficientes", "No, en ningún caso podrá adoptarse con fines económicos", "Sí, si así lo solicita motivadamente el empleador", "Solo si el interesado mantiene deudas con la Seguridad Social"], "a": 1, "exp": "Prohibición expresa de adoptar la expulsión con fines económicos."}, {"lvl": "avanzado", "q": "¿Puede revocarse de oficio una resolución de expulsión de comunitario?", "opts": ["No, la resolución de expulsión de comunitario es irrevocable", "Sí, de oficio o a instancia de parte cuando de s de proporcionalidad y gravedad exigidos para adoptar medidas limitativas."}, {"lvl": "medio", "q": "Si un ciudadano comunitario sale de España (no fallece), ¿pierden sus hijos escolarizados y el progenitor a su cargo el derecho de residencia?", "opts": ["Sí, automáticamente pierden el derecho de residencia", "No, siempre que residan en España y estén escolarizados, hasta la finalización de los estudios", "Solo la mantienen si el progenitor a su cargo es también comunitario", "Sí, salvo que soliciten en el plazo de 1 mes un nuevo visado"], "a": 1, "exp": "La salida de España del comunitario no supone la pérdida de residencia de sus hijos ni del progenitor si residen en España y están escolarizados."}, {"lvl": "avanzado", "q": "Además del paro involuntario, ¿en qué otros supuestos del art. 9 se mantiene la condición de trabajador comunitario?", "opts": ["Únicamente en caso de jubilación anticipada", "Por incapacidad temporal (enfermedad o accidente) y mientras sigue formación profesional", "Únicamente durante el disfrute de vacaciones no retribuidas", "Únicamente durante el disfrute de vacaciones retribuidas ordinarias"], "a": 1, "exp": "Art. 9: se mantiene también por incapacidad temporal y mientras se sigue formación profesional."}, {"lvl": "avanzado", "q": "En 'circunstancias especialmente difíciles', ¿qué medida provisional y qué medida definitiva protegen a la víctima de violencia de género (VioGen) a efectos de mantener la residencia?", "opts": ["Solo cabe acudir a la vía penal, sin medidas administrativas", "Provisional: orden de protección o informe del MF; definitiva: resolución judicial", "Solo un informe policial, sin necesidad de más trámite", "Solo mediante sentencia penal condenatoria firme, sin fase provisional"], "a": 1, "exp": "VioGen: provisional (OP/informe MF) y definitiva (resolución judicial); análogo para trata de seres humanos por cónyuge o pareja."}, {"lvl": "medio", "q": "¿En qué casos pueden ser verificados los ciudadanos UE y sus familiares que tienen derecho de residencia, y afecta a la expulsión el uso de la asistencia social?", "opts": ["Se verifican sistemáticamente y usar la asistencia social supone la expulsión", "Solo serán verificados ante dudas razonables; usar la asistencia social no implica expulsión", "Se verifican de oficio cada 6 meses, con independencia de que existan dudas", "Se expulsa automáticamente si usan la asistencia social más de una vez"], "a": 1, "exp": "Verificación solo ante dudas razonables; el uso de la asistencia social no implica per se la expulsión, ni tampoco mientras trabajan o buscan empleo con posibilidades reales."}, {"lvl": "basico", "q": "¿Con qué diligencia debe expedirse el Certificado del Derecho a Residir con Carácter Permanente tras 5 años de residencia legal continuada?", "opts": ["En un plazo máximo de 6 meses desde la solicitud", "A petición del interesado, con la mayor brevedad", "Solo de oficio, sin que pueda instarlo el propio interesado", "En un plazo máximo de 1 año desde que se cumplen los 5 años"], "a": 1, "exp": "Art. 10: a petición del interesado, la OEX o Comisaría expedirá el certificado con la mayor brevedad."}], "71": [{"lvl": "basico", "q": "Según la LO 4/2000, ¿quién se considera extranjero?", "opts": ["Quien no tenga domicilio habitual en territorio español", "Quien carezca de la nacionalidad española", "Quien tenga doble nacionalidad, siendo una de ellas la española", "Quien no acredite conocimiento suficiente del idioma español"], "a": 1, "exp": "Art. 1 LO 4/2000: extranjeros son los que carecen de nacionalidad española."}, {"lvl": "basico", "q": "¿Se aplica la LO 4/2000 a quienes están sometidos al régimen comunitario?", "opts": ["Solo si el familiar renuncia expresamente a la aplicación de la LO 4/2000", "Sí, en aquellos aspectos que pudieran ser más favorables", "Solo si renuncian previamente al régimen comunitario que les corresponde", "Únicamente se aplica a los familiares no comunitarios, nunca al propio comunitario"], "a": 1, "exp": "La LOEX se aplica de forma complementaria cuando resulte más favorable al régimen comunitario."}, {"lvl": "basico", "q": "¿Quiénes quedan excluidos del ámbito de aplicación de la LO 4/2000?", "opts": ["Todos los turistas que entren con visado de corta duración", "Agentes diplomáticos, funcionarios consulares y miembros de misiones/organismos internacionales acreditados en España, y sus familiares", "Los estudiantes extranjeros matriculados en centros públicos", "Los trabajadores extranjeros por cuenta ajena con contrato indefinido"], "a": 1, "exp": "Art. 2 LO 4/2000: exclusión del personal diplomático/consular/organismos internacionales y familiares."}, {"lvl": "medio", "q": "¿Cuánto tiempo debe llevar de residencia el reagrupante para poder reagrupar a su cónyuge?", "opts": ["6 meses de permiso de residencia en vigor", "Al menos 1 año de permiso de residencia", "2 años de permiso de residencia continuados", "No se exige plazo mínimo de residencia previa del reagrupante"], "a": 1, "exp": "El reagrupante debe contar con permiso de residencia de, al menos, 1 año."}, {"lvl": "medio", "q": "Tras cuántos años de convivencia en España el cónyuge reagrupado conserva la residencia aunque se rompa el vínculo matrimonial?", "opts": ["1 año de convivencia en España tras la reagrupación", "2 años de convivencia en España", "5 años de convivencia en España", "No la conserva nunca, salvo resolución judicial expresa"], "a": 1, "exp": "Tras 2 años de convivencia en España conservará la residencia aunque se rompa el vínculo."}, {"lvl": "medio", "q": "¿Pueden coexistir matrimonio y pareja de hecho registrada como situaciones compatibles a efectos de reagrupación?", "opts": ["Sí, siempre que ambos cónyuges estén separados de hecho", "No, se consideran incompatibles entre sí", "Sí, sin ninguna restricción entre ambas situaciones", "Solo si ambos miembros de la pareja son extranjeros"], "a": 1, "exp": "Matrimonio y pareja registrada se consideran incompatibles entre sí, igual que en el régimen comunitario."}, {"lvl": "medio", "q": "¿Cuántos cónyuges puede reagrupar, como máximo, un mismo reagrupante?", "opts": ["Hasta 2 cónyuges, si la ley del país de origen admite la poligamia", "En ningún caso más de un cónyuge, aunque la poligamia sea legal en origen", "Sin límite, siempre que se acredite el vínculo matrimonial", "Hasta 3 cónyuges como máximo, previa autorización de la OEX"], "a": 1, "exp": "Se prohíbe expresamente la reagrupación de más de un cónyuge, aunque la poligamia sea legal en el país de origen."}, {"lvl": "medio", "q": "¿Qué medios económicos debe acreditar el reagrupante para reagrupar a su familia, según la LO 4/2000?", "opts": ["200% del IPREM para el reagrupante y 100% adicional por cada familiar", "400% del IPREM para el reagrupante y 100% adicional por cada familiar (sin computar ayudas de la SS)", "Un salario mínimo interprofesional completo, computando las ayudas de la SS", "300% del IPREM para el reagrupante, sin exigencia adicional por familiar"], "a": 1, "exp": "El reagrupante debe acreditar vivienda adecuada y medios suficientes: 400% del IPREM para sí y 100% adicional por cada familiar, sin computar las ayudas de la SS."}, {"lvl": "medio", "q": "¿Pueden los extranjeros residentes ser titulares del derecho de sufragio en España según la LO 4/2000?", "opts": ["Sí, tanto en las elecciones municipales como en las autonómicas", "Sí, en las elecciones municipales", "Sí, en cualquier elección, incluidas las generales al Congreso", "Solo si son ciudadanos comunitarios, nunca los de terceros países"], "a": 1, "exp": "Los extranjeros residentes podrán ser titulares del derecho de sufragio en las elecciones municipales."}, {"lvl": "basico", "q": "¿En qué condiciones tienen los extranjeros el derecho de reunión, manifestación y asociación según la LO 4/2000?", "opts": ["No tienen reconocido ese derecho conforme a la LO 4/2000", "En las mismas condiciones que los españoles", "Solo mediando autorización administrativa previa y específica", "Solo los residentes de larga duración tienen reconocido ese derecho"], "a": 1, "exp": "Art. correspondiente: derecho de reunión, manifestación y asociación en las mismas condiciones que los españoles."}, {"lvl": "medio", "q": "¿En qué plazo debe solicitarse la Tarjeta de Identidad de Extranjero (TIE), y qué colectivos tienen un régimen distinto?", "opts": ["3 meses desde la autorización correspondiente, sin excepciones por colectivo", "1 mes desde la autorización correspondiente; los trabajadores transfronterizos la obtienen aunque la permanencia sea inferior a 6 meses, y los de temporada no tienen que obtenerla", "6 meses en todo caso, igual para todos los colectivos", "Plazo de 3 meses, igual para todos los colectivos, sin distinción por régimen"], "a": 1, "exp": "TIE obligatoria para permanencias superiores a 6 meses, solicitud en plazo de 1 mes, con las excepciones de transfronterizos y trabajadores de temporada."}, {"lvl": "basico", "q": "¿Qué derecho educativo tienen los extranjeros entre 16 y 18 años según la LO 4/2000?", "opts": ["Ningún derecho a la educación reconocido en esta franja de edad", "Derecho a la enseñanza postobligatoria", "Solo derecho a la educación básica gratuita, igual que los menores de 16", "Deben abandonar el sistema educativo al cumplir los 16 años"], "a": 1, "exp": "Menores de 16: educación básica obligatoria y gratuita; entre 16-18: derecho a la enseñanza postobligatoria; mayores de 18 residentes: mismas condiciones que españoles."}], "72": [{"lvl": "medio", "q": "¿Puede un menor de 16 años figurar incluido en el pasaporte de sus padres o tutor para entrar en España?", "opts": ["No, siempre necesita pasaporte propio con independencia de su edad", "Sí, cuando tenga la misma nacionalidad y viaje con ellos", "Solo si es hijo único de ambos progenitores", "Solo con autorización judicial previa expresa"], "a": 1, "exp": "Art. 25 LOEX/RD 1155/2024: los menores de 16 años pueden figurar en el pasaporte de sus padres/tutor si tienen su misma nacionalidad y viajan con ellos."}, {"lvl": "medio", "q": "¿Qué colectivo queda exento de visado sin límite de días, a diferencia del resto de exenciones (que se limitan a 90 días en 180)?", "opts": ["Los turistas en general que viajen por motivos de ocio", "Los trabajadores transfronterizos", "Los estudiantes que participan en programas Erasmus", "Los deportistas profesionales en competición internacional"], "a": 1, "exp": "Están exentos de visado, sin límite de estancia asociado, los trabajadores transfronterizos; el resto de exenciones (nacionales de países exentos UE, tripulaciones, refugiados documentados, etc.) se limitan a 90 días en 180."}, {"lvl": "avanzado", "q": "¿Quién puede prohibir la salida de España por razones de seguridad nacional o salud pública, y a iniciativa de quién puede iniciarse el expediente?", "opts": ["Únicamente un Juez, actuando siempre de oficio", "El MI, a iniciativa propia o a propuesta de la SES, Delegados/Subdelegados del Gobierno, autoridades sanitarias, o a petición de españoles/extranjeros residentes legales afectados", "Únicamente el Ministerio Fiscal, con carácter exclusivo", "No cabe prohibición de salida en ningún caso, ni siquiera por seguridad nacional"], "a": 1, "exp": "RD 1155/2024: el MI resuelve, con instrucción de carácter siempre individual y notificada, a iniciativa propia o a propuesta/petición de los sujetos tasados."}, {"lvl": "avanzado", "q": "¿Hasta qué distancia pueden circular los marinos con documento de identidad del marino (DIM) en vigor durante una escala, sin pasar por el puesto fronterizo?", "opts": ["5 km durante la escala, sin pasar por el puesto fronterizo", "10 km durante la escala, sin pasar por el puesto fronterizo", "20 km durante la escala, sin pasar por el puesto fronterizo", "No pueden circular sin pasar por el puesto fronterizo en ningún caso"], "a": 1, "exp": "Nota recuadrada: los marinos con DIM en vigor, figurando en la lista de tripulantes, pueden circular hasta 10 km durante la escala."}, {"lvl": "medio", "q": "¿Qué órgano puede autorizar excepcionalmente la entrada en España de extranjeros que no reúnan los requisitos generales, y por qué motivos?", "opts": ["La CGEyF, por razones humanitarias, interés público o cumplimiento de compromisos adquiridos por España", "Cualquier comisaría local, sin necesidad de motivación alguna", "El Ministerio Fiscal, únicamente en supuestos de solicitud de asilo", "No cabe ninguna excepción a los requisitos generales de entrada"], "a": 0, "exp": "Nota recuadrada art. 25 RD 1155/2024: la CGEyF puede autorizar la entrada excepcional por razones humanitarias, interés público o compromisos de España."}], "73": [{"lvl": "medio", "q": "¿Qué habilita el visado Tipo A del Código de Visados Schengen?", "opts": ["Atravesar el territorio español de un extremo a otro", "Permanecer en la zona de tránsito internacional de un aeropuerto español sin acceder al territorio nacional", "Residir en España hasta un máximo de 90 días", "Trabajar por cuenta ajena durante la escala aeroportuaria"], "a": 1, "exp": "Tipo A - Tránsito Aeroportuario: permanencia en zona de tránsito internacional del aeropuerto, sin acceder al territorio, durante escalas."}, {"lvl": "basico", "q": "¿Cuál es la duración máxima de estancia que habilita el Visado Tipo C (Estancia de Corta Duración) del Código de Visados Schengen?", "opts": ["30 días, prorrogables por causa justificada", "No exceder de 3 meses por semestre desde la primera entrada (máx. 90 días en 180)", "6 meses continuados desde la primera entrada", "1 año, computado desde la fecha de expedición del visado"], "a": 1, "exp": "Visado Tipo C: estancia ininterrumpida o sucesiva que no exceda de 3 meses por semestre (máx. 90 días en 180)."}, {"lvl": "avanzado", "q": "Cuando un extranjero NACIONAL DE UN TERCER PAÍS que reside en otro Estado Schengen entra en España por una frontera interior (ej. París-Madrid), ¿qué debe hacer y en qué plazo?", "opts": ["Nada, no existe ninguna obligación al tratarse de frontera interior", "Una Declaración de Entrada en el plazo de 3 días hábiles", "Solicitar un visado de tránsito en el plazo de 15 días", "Inscribirse en el Registro Central de Extranjeros en el plazo de 1 mes"], "a": 1, "exp": "Art. 13-14 RD 1155/2024 (antes art. 22 CAAS/RD 557/2011): en frontera interior Schengen-Schengen no hay controles fronterizos, pero si el extranjero es NACIONAL DE UN TERCER PAÍS (no un ciudadano comunitario) y reside en otro Estado Schengen, debe hacer una Declaración de Entrada en el plazo de 3 días hábiles, en cualquier Comisaría del CNP u Oficina de Extranjería, salvo que ya se hiciera al entrar. Ojo: la obligación recae sobre el tercer país nacional, no sobre el ciudadano comunitario."}, {"lvl": "avanzado", "q": "Ante una amenaza grave e imprevisible para el orden público o la seguridad interior que exija actuación inmediata (art. 25 bis, primer supuesto), ¿cuánto puede durar el restablecimiento de fronteras y cuáles son sus prórrogas?", "opts": ["1 mes, con prórrogas de hasta 3 meses adicionales", "6 meses, con prórrogas de hasta 2 años", "Duración indefinida, sin necesidad de notificación a las instituciones europeas", "15 días, sin posibilidad de prórroga"], "a": 0, "exp": "Primer supuesto: actuación inmediata, duración de 1 mes, con prórrogas por periodos adicionales de máximo 3 meses."}, {"lvl": "medio", "q": "¿Cuántos meses puede trabajar por cuenta ajena, como máximo, el titular de un Visado de Residencia y Trabajo de Temporada, dentro de un periodo de 12 meses consecutivos?", "opts": ["6 meses de actividad por cuenta ajena en 12 meses consecutivos", "9 meses de actividad por cuenta ajena en 12 meses consecutivos", "12 meses sin límite dentro del periodo de vigencia del visado", "3 meses de actividad por cuenta ajena en 12 meses consecutivos"], "a": 1, "exp": "Visado de Residencia y Trabajo de Temporada: hasta 9 meses de actividad por cuenta ajena en 12 meses consecutivos."}, {"lvl": "basico", "q": "¿Qué territorios comprende la frontera interior Schengen?", "opts": ["Únicamente las fronteras terrestres entre Estados Schengen", "Fronteras terrestres, marítimas, fluviales y lacustres comunes, además de los aeropuertos y puertos destinados a vuelos o trayectos interiores", "Únicamente los aeropuertos con vuelos entre Estados Schengen", "Únicamente los puestos fronterizos terrestres habilitados oficialmente"], "a": 1, "exp": "Frontera interior: fronteras comunes terrestres/marítimas/fluviales/lacustres entre Estados Schengen, más aeropuertos y puertos marítimos/fluviales/lacustres para vuelos o trayectos interiores. Regla de oro: no hay controles fronterizos entre Estados Schengen."}, {"lvl": "medio", "q": "¿Qué se entiende por 'vuelo interior' a efectos del Código de Fronteras Schengen?", "opts": ["Cualquier vuelo que sobrevuele territorio de un tercer país, aunque no aterrice en él", "Un vuelo cuyo origen y destino están exclusivamente en territorio de Estados miembros, sin aterrizar en un tercer país, aunque sobrevuele espacio aéreo internacional", "Únicamente los vuelos nacionales dentro de un mismo Estado miembro", "Un vuelo que hace escala técnica en un tercer país sin desembarque de pasajeros"], "a": 1, "exp": "Vuelo interior: origen y destino en Estados miembros, sin aterrizar en territorio de un tercer país; se trata como cruce de frontera interior aunque sobrevuele espacio aéreo internacional."}, {"lvl": "medio", "q": "Un vuelo Chipre-Madrid, ¿qué tipo de frontera cruza y por qué?", "opts": ["Frontera interior, porque Chipre es Estado miembro de la UE", "Frontera exterior Schengen, porque Chipre es Estado UE pero no aplica aún el acervo Schengen en materia de fronteras, aunque el viajero sea comunitario", "Frontera interior, porque ambos países usan el euro como moneda", "No se considera cruce de frontera a estos efectos, al ser vuelo intracomunitario"], "a": 1, "exp": "Aunque Chipre es miembro de la UE, no aplica todavía el acervo Schengen en fronteras, por lo que el vuelo Chipre-Madrid cruza una frontera exterior Schengen, aunque el viajero sea beneficiario de la libre circulación de la UE."}, {"lvl": "medio", "q": "En la frontera exterior Schengen, ¿qué control se aplica al beneficiario del régimen comunitario que llega de un Estado UE no perteneciente aún a Schengen (ej. Chipre-Madrid)?", "opts": ["Inspección minuciosa idéntica a la de un nacional de tercer país", "Control sistemático pero simple y rápido: comprobación de pasaporte/DNI válido y nacionalidad, y consulta SIS únicamente para verificar que no supone una amenaza", "Ningún control, al tratarse de un ciudadano de la UE", "Únicamente el sellado del pasaporte, sin consulta a ninguna base de datos"], "a": 1, "exp": "Al beneficiario de la libre circulación UE se le aplica un control sistemático pero simple y rápido: pasaporte/DNI válido con la nacionalidad (y visado si procede) y consulta SIS solo para descartar amenaza, sin revisar exhaustivamente el resto de requisitos de entrada."}, {"lvl": "medio", "q": "Un vuelo Colombia-Madrid, al tratarse de un nacional de tercer país sin libre circulación UE, ¿qué tipo de control se le aplica?", "opts": ["El mismo control simple y rápido que a un comunitario", "La inspección minuciosa del art. 8 CFS, comprobando exhaustivamente todos los requisitos de entrada del art. 6 CFS, tanto a la entrada como a la salida", "Ningún control, al tratarse de un país con acuerdo de exención de visado", "Únicamente la consulta al SIS, sin más comprobación documental"], "a": 1, "exp": "Al nacional de tercer país sin derecho a libre circulación UE se le aplica la inspección minuciosa (art. 8 CFS): comprobación exhaustiva de documento de viaje, visado, justificación de objeto y duración de la estancia, medios económicos, no figurar en el SIS y no ser una amenaza, tanto a la entrada como a la salida."}, {"lvl": "medio", "q": "¿Hasta qué edad puede un hijo menor figurar incluido en el pasaporte de sus padres para acreditar su identidad en la entrada, según el art. 6 CFS/art. 4-9 RD 1155/2024?", "opts": ["Menor de 14 años, si comparte la nacionalidad de sus padres", "Menor de 16 años, si comparte la nacionalidad de sus padres", "Menor de 18 años, sin necesidad de compartir nacionalidad", "No cabe esta posibilidad en ningún caso, siempre se exige pasaporte propio"], "a": 1, "exp": "Art. 6 CFS / art. 4-9 RD 1155/2024: el hijo menor de 16 años puede figurar en el pasaporte de sus padres si comparte su nacionalidad."}, {"lvl": "medio", "q": "¿Desde cuándo se sustituye progresivamente el sellado físico del pasaporte por el Sistema de Entradas y Salidas (SES)?", "opts": ["Desde enero de 2024", "Desde octubre de 2025", "Desde mayo de 2025, coincidiendo con la entrada en vigor del RD 1155/2024", "El sellado físico nunca se sustituye por el SES"], "a": 1, "exp": "El sello de entrada se estampa en el documento salvo que el SES sustituya ya el sellado físico, como ocurre progresivamente desde octubre de 2025."}, {"lvl": "medio", "q": "¿Qué documentos eximen a un extranjero de la exigencia de visado al entrar en España, según el manual del CFS?", "opts": ["Únicamente el pasaporte en vigor, sin ningún otro documento adicional", "TIE en vigor, Tarjeta de Identificación diplomática, TIE de trabajador transfronterizo, autorización de regreso, o ser solicitante de protección internacional", "Únicamente un contrato de trabajo vigente en España", "Únicamente una reserva de hotel confirmada en territorio español"], "a": 1, "exp": "No se exige visado si el extranjero acredita: TIE en vigor, Tarjeta de Identificación diplomática, TIE de trabajador transfronterizo, autorización de regreso, o su condición de solicitante de protección internacional (a quien se concede un visado especial en frontera)."}, {"lvl": "avanzado", "q": "¿Qué es la 'autorización de regreso' y quién puede concederla?", "opts": ["Un visado ordinario de larga duración concedido por la embajada española", "Un documento que permite volver a España, por ejemplo cuando la TIE está caducada y en trámite de renovación; la concede el Delegado/Subdelegado del Gobierno, el CGEF, o los titulares de comisarías y puestos fronterizos del CNP, con vigencia máxima de 90 días", "Un documento que solo puede conceder el Ministro del Interior personalmente", "Un permiso de residencia temporal de urgencia, con vigencia máxima de 1 año"], "a": 1, "exp": "Art. 5 RD 1155/2024: la autorización de regreso (p. ej. TIE caducada en trámite de renovación) la concede el Delegado/Subdelegado del Gobierno, el CGEF, o los titulares de comisarías y puestos fronterizos del CNP, con vigencia máxima de 90 días."}, {"lvl": "medio", "q": "Además de no necesitar visado (si procede), ¿qué debe justificar en todo caso el extranjero que pretende entrar en España?", "opts": ["Únicamente su lugar de nacimiento y estado civil", "El objeto y motivo de su estancia, y acreditar medios de vida económicos suficientes para su estancia, retorno o tránsito, y el modo lícito de obtenerlos", "Únicamente su nivel de estudios y profesión habitual", "Únicamente su domicilio habitual en el país de origen"], "a": 1, "exp": "En todos los casos debe justificar el objeto y motivo de la estancia (billete de vuelta, invitación de empresa, reserva de hospedaje, etc.) y acreditar medios de vida suficientes, obtenidos de modo lícito."}, {"lvl": "medio", "q": "¿Qué causas permiten a la CGEF autorizar excepcionalmente la entrada en España de un extranjero que no reúna los requisitos generales?", "opts": ["Únicamente razones económicas del propio extranjero", "Razones excepcionales de índole humanitaria, interés público, o cumplimiento de compromisos adquiridos por España", "Únicamente si el extranjero lo solicita expresamente por escrito", "Únicamente en caso de reciprocidad diplomática con el país de origen"], "a": 1, "exp": "Art. 4.3 RD 1155/2024: la CGEF puede autorizar excepcionalmente la entrada por razones humanitarias, interés público o cumplimiento de compromisos de España (p.ej. solicitantes de asilo o estudiantes con requisito formal no cumplido). Si figuraba 'no admisible' en el SIS, se informa de la excepción a los demás Estados miembros."}, {"lvl": "avanzado", "q": "¿Por qué razones puede el Ministro del Interior prohibir excepcionalmente la salida de España a un extranjero, y qué carácter tiene esta prohibición?", "opts": ["Por motivos económicos, con carácter colectivo si es necesario", "Por seguridad nacional o salud pública, con carácter siempre individual y notificado formalmente al interesado", "Por cualquier motivo de orden público, con carácter colectivo y sin notificación", "Únicamente por resolución judicial previa, nunca a iniciativa propia del Ministro"], "a": 1, "exp": "Art. 28.2 LOEX (desarrollado en art. 22 RD 1155/2024): el MI puede prohibir excepcionalmente la salida por seguridad nacional o salud pública; la prohibición tiene siempre carácter individual (nunca colectivo) y se notifica formalmente al interesado."}, {"lvl": "avanzado", "q": "¿Quién puede proponer al Ministro del Interior la prohibición de salida de un extranjero, además de poder acordarse a iniciativa propia?", "opts": ["Únicamente el Ministerio Fiscal", "La Secretaría de Estado de Migraciones, la Secretaría de Estado de Seguridad, el Delegado/Subdelegado del Gobierno, las autoridades sanitarias, o incluso ciudadanos españoles o extranjeros residentes legales perjudicados por esa salida", "Únicamente un Juez de Instrucción competente", "Únicamente las autoridades sanitarias, con carácter exclusivo"], "a": 1, "exp": "Puede acordarse a iniciativa propia del Ministro o a propuesta/instancia de la SE de Migraciones, la SE de Seguridad, Delegado/Subdelegado del Gobierno, autoridades sanitarias, o de ciudadanos españoles o extranjeros residentes legales que puedan verse perjudicados."}, {"lvl": "medio", "q": "¿Es lo mismo la 'prohibición de salida' del art. 28.2 LOEX que la obligación de salida forzosa por expulsión?", "opts": ["Sí, son la misma figura con distinto nombre", "No: la prohibición de salida (art. 28.2) es excepcional y tasada (seguridad nacional/salud pública); la obligación de salida forzosa por expulsión, denegación de permanencia, etc. (art. 28.3 LOEX) no es excepcional sino reglada", "No, la obligación de salida forzosa es siempre voluntaria para el extranjero", "Sí, ambas requieren necesariamente resolución judicial previa"], "a": 1, "exp": "Distinción clave del manual: la prohibición de salida excepcional (art. 28.2) frente a la obligación de salida forzosa reglada (art. 28.3 LOEX) por expulsión, denegación de solicitudes de permanencia, etc."}, {"lvl": "basico", "q": "¿Qué dos condiciones deben concurrir para que la entrada de un extranjero en España sea válida?", "opts": ["Únicamente disponer de pasaporte válido en vigor", "Realizarse por un puesto habilitado dentro de sus horas de apertura, y no suponer el extranjero un peligro para el orden público, la salud, la seguridad o las relaciones internacionales de España", "Únicamente no figurar en el SIS como no admisible", "Únicamente acreditar medios económicos suficientes"], "a": 1, "exp": "La entrada solo es válida si concurren ambas condiciones: puesto habilitado en horario de apertura, y ausencia de peligro para orden público, salud, seguridad o relaciones internacionales de España (o de otros Estados con convenio)."}, {"lvl": "medio", "q": "¿Qué órgano tiene la competencia formal para ordenar el cierre de los puestos habilitados fronterizos, y por qué motivos?", "opts": ["El Ministerio del Interior, exclusivamente por motivos de seguridad", "El Ministerio de la Presidencia, Justicia y Relaciones con las Cortes, a propuesta de los ministerios competentes, por estados de alarma/excepción/sitio, leyes especiales, defensa nacional, seguridad del Estado, protección de la salud/seguridad ciudadana o elevada presión migratoria irregular", "El Ministerio de Asuntos Exteriores, sin necesidad de propuesta de otros departamentos", "La Comisaría General de Extranjería y Fronteras, de forma autónoma"], "a": 1, "exp": "Art. 3 RD 1155/2024: aunque intuitivamente se pensaría en Interior, la competencia formal recae en el Ministerio de la Presidencia, Justicia y Relaciones con las Cortes, precisamente porque conjuga propuestas de varios departamentos (Interior, Exteriores, Hacienda)."}, {"lvl": "medio", "q": "¿A quién se deniega o impide la entrada, aun estando el puesto fronterizo abierto y dentro de su horario?", "opts": ["Únicamente a quien viaje sin equipaje facturado", "A quien padezca enfermedad contagiosa de potencial epidémico (OMS) u otras infecciosas/parasitarias transmisibles, esté condenado por delitos con pena privativa de libertad, o esté reclamado (búsqueda y captura internacional) y sea detenido en el puesto", "Únicamente a quien no domine el idioma español", "Únicamente a los menores de edad no acompañados"], "a": 1, "exp": "Se deniega o impide la entrada, entre otros, a quienes padezcan enfermedad contagiosa de potencial epidémico según la OMS u otras infecciosas/parasitarias transmisibles, estén condenados por delitos con pena privativa de libertad, o estén reclamados y sean detenidos en el mismo puesto fronterizo con vistas a su expulsión."}, {"lvl": "avanzado", "q": "Según el art. 25 CFS, ¿qué causas (enumeradas 'en particular', sin ser exhaustivas) pueden justificar el restablecimiento temporal de controles en fronteras interiores?", "opts": ["Únicamente los actos o amenazas terroristas", "Actos o amenazas terroristas y delincuencia organizada grave; emergencias migratorias a gran escala; movimientos repentinos y a gran escala no autorizados de nacionales de terceros países; acontecimientos internacionales de gran magnitud", "Únicamente las emergencias migratorias a gran escala", "Únicamente los acontecimientos deportivos internacionales de gran magnitud"], "a": 1, "exp": "Art. 25 CFS: amenaza grave para el orden público o la seguridad interior, con cuatro causas típicas no exhaustivas (terrorismo/delincuencia organizada grave, emergencias migratorias, movimientos repentinos a gran escala, acontecimientos internacionales de gran magnitud). El restablecimiento es siempre medida de último recurso, limitada a lo estrictamente necesario."}, {"lvl": "avanzado", "q": "En el supuesto 2 del art. 25 bis (amenaza previsible), ¿con qué antelación debe notificarse el restablecimiento y cuál es su duración máxima total con prórrogas?", "opts": ["Notificación en el momento mismo; máximo 3 meses", "Notificación con al menos 4 semanas de antelación (o antes si se conoce con menos margen); duración inicial de hasta 6 meses, con prórrogas renovables de hasta 6 meses cada una hasta un máximo total de 2 años", "Notificación con 4 semanas de antelación; duración fija de 1 año sin prórrogas", "No requiere notificación previa a las instituciones europeas"], "a": 1, "exp": "Supuesto 2 (amenaza previsible) del art. 25 bis: notificación con al menos 4 semanas de antelación al Parlamento Europeo, Consejo, Comisión y demás Estados miembros; duración inicial hasta 6 meses, prorrogable por periodos de hasta 6 meses cada uno, con un máximo total de 2 años."}, {"lvl": "avanzado", "q": "En el supuesto 3 del art. 25 bis (situación excepcional persistente más allá de los 2 años), ¿qué debe hacer la Comisión tras la notificación?", "opts": ["Nada, la prórroga es automática sin intervención de la Comisión", "En el plazo de 3 meses desde la notificación, emitir un nuevo dictamen sobre la necesidad y proporcionalidad de la medida", "Convocar automáticamente al Consejo Europeo en pleno", "Autorizar directamente una prórroga indefinida sin plazo de revisión"], "a": 1, "exp": "Supuesto 3: notificación con al menos 4 semanas de antelación; se admite una prórroga adicional de hasta 6 meses, y la Comisión, en el plazo de 3 meses desde la notificación, emite un nuevo dictamen sobre la necesidad y proporcionalidad."}, {"lvl": "avanzado", "q": "¿Cuál es la diferencia clave entre el mecanismo del art. 28 CFS (emergencia de salud pública a gran escala) y el del art. 25 bis en cuanto a la renovación del restablecimiento de fronteras?", "opts": ["Son idénticos, ambos se renuevan por decisión unilateral del Estado miembro", "En el art. 28, la prórroga de hasta 6 meses adicionales requiere que sea a propuesta de la Comisión Europea, dado el carácter transnacional de la emergencia sanitaria, a diferencia del art. 25 bis", "En el art. 28 no cabe ninguna prórroga bajo ningún concepto", "El art. 28 solo permite el restablecimiento en fronteras marítimas, nunca terrestres"], "a": 1, "exp": "Art. 28 CFS: duración hasta 6 meses, renovación hasta 6 meses adicionales, pero a propuesta de la Comisión Europea (a diferencia del art. 25 bis, donde la prórroga puede depender de la decisión del propio Estado). El ejemplo histórico es la COVID-19 en marzo de 2020 (España-Francia y España-Portugal)."}], "74": [{"lvl": "medio", "q": "¿Qué tres situaciones permiten permanecer en España (además de la estancia y residencia) según el manual?", "opts": ["Únicamente estancia y residencia, sin más situaciones posibles", "Estancia de corta duración, estancia de larga duración, residencia y tránsito aeroportuario", "Únicamente la situación de residencia, sea temporal o de larga duración", "Únicamente el tránsito aeroportuario, como situación exclusiva de permanencia"], "a": 1, "exp": "Cuatro situaciones posibles recogidas en el Capítulo II del Título II."}, {"lvl": "medio", "q": "¿Cuál es la duración máxima de la estancia de corta duración?", "opts": ["30 días desde la entrada en territorio español", "90 días", "6 meses, prorrogables por causa justificada", "1 año desde la fecha de expedición del visado"], "a": 1, "exp": "Estancia de corta duración: máximo 90 días."}, {"lvl": "avanzado", "q": "Para solicitudes de estancia de larga duración DENTRO de España (estudios superiores/sanitarios), ¿con qué antelación mínima debe presentarse la solicitud y en qué plazo se resuelve (silencio)?", "opts": ["1 mes de antelación; resolución en 30 días, silencio positivo", "2 meses de antelación al inicio; resolución en 15 días, silencio negativo", "Sin antelación mínima; resolución en 7 días, silencio positivo", "3 meses de antelación; resolución en 1 mes, silencio negativo"], "a": 1, "exp": "Antelación mínima de 2 meses; resolución en 15 días con silencio negativo (para solicitudes dentro de España)."}, {"lvl": "medio", "q": "¿Cuánto puede prorrogarse una estancia de corta duración con visado, cuando este es inferior a 3 meses?", "opts": ["Máximo 1 mes adicional, sin plazo total de referencia", "Máximo 3 meses adicionales dentro de un plazo de 6 meses", "Máximo 6 meses adicionales, sin límite de plazo total", "No se puede prorrogar una estancia de corta duración con visado"], "a": 1, "exp": "Prórroga máxima de 3 meses dentro de un plazo total de 6 meses."}, {"lvl": "medio", "q": "¿Qué formalidad distingue la prórroga de estancia con visado frente a sin visado?", "opts": ["Ambas emplean idéntico trámite, sin distinción formal", "Con visado se coloca nueva etiqueta de visado; sin visado se estampa un sello en el pasaporte", "Con visado se estampa sello; sin visado se coloca una nueva etiqueta", "Ambas requieren autorización judicial previa a su concesión"], "a": 1, "exp": "Distinción formal en el modo de documentar la prórroga."}, {"lvl": "avanzado", "q": "¿Qué autoridad puede autorizar excepcionalmente la estancia por motivos humanitarios a quienes entraron con documentación defectuosa o por lugares no habilitados, y por cuánto tiempo?", "opts": ["El Juez de Instrucción, sin límite de tiempo determinado", "El MIR o el Ministerio de Inclusión, Seguridad Social y Migraciones, por un máximo de 90 días en 180", "El Ministerio Fiscal, por un plazo máximo de 6 meses", "No cabe esta autorización excepcional en ningún caso"], "a": 1, "exp": "Autorización excepcional: máx. 90 días en un periodo de 180."}, {"lvl": "avanzado", "q": "¿Qué diferencia existe entre discriminación directa e indirecta según el manual?", "opts": ["No existe diferencia, ambos conceptos son equivalentes", "La indirecta usa criterios aparentemente neutrales que en la práctica perjudican a los trabajadores extranjeros; la directa es un trato desigual explícito", "La discriminación directa solo se aplica a los menores de edad", "La discriminación indirecta requiere siempre intencionalidad probada"], "a": 1, "exp": "Discriminación indirecta: criterios formalmente neutros con efecto perjudicial de facto sobre extranjeros."}, {"lvl": "avanzado", "q": "¿En cuántos días máximo debe emitirse el informe policial y del registro central de penados en autorizaciones de estancia de larga duración por estudios?", "opts": ["3 días desde la solicitud de la autorización", "5 días", "10 días desde la solicitud de la autorización", "15 días desde la solicitud de la autorización"], "a": 1, "exp": "Los informes se emiten en el plazo de 5 días; los antecedentes en el informe policial no suponen denegación automática."}, {"lvl": "avanzado", "q": "¿Qué límite semanal de horas de trabajo compatible se establece para quienes tienen autorización de estancia por estudios (no superiores)?", "opts": ["20 horas semanales", "30 horas semanales", "40 horas semanales, equiparable a la jornada ordinaria", "No existe límite de horas semanales para esta autorización"], "a": 1, "exp": "Las actividades laborales compatibles no pueden superar las 30 horas semanales."}, {"lvl": "avanzado", "q": "¿Cuál es el límite de duración general de la estancia de larga duración, salvo estudios superiores y sanitarios?", "opts": ["6 meses, coincidiendo con el límite de la estancia de corta duración", "1 año", "2 años, salvo prórroga expresa de la actividad", "3 años, con independencia del tipo de actividad"], "a": 1, "exp": "Límite general de 1 año, con excepción de estudios superiores/sanitarios que pueden superarlo."}, {"lvl": "avanzado", "q": "¿Cuánto tiempo, tras finalizar sus estudios superiores en España, puede quedarse el extranjero para buscar empleo o iniciar un proyecto empresarial, y cuándo debe solicitarlo?", "opts": ["12 meses; solicitud únicamente antes de finalizar los estudios", "Hasta 24 meses; solicitud entre 60 días antes y 90 después de finalizar los estudios", "6 meses; solicitud inmediata tras la finalización de los estudios", "36 meses, sin plazo determinado para la solicitud"], "a": 1, "exp": "Residencia para búsqueda de empleo/emprendimiento: hasta 24 meses, solicitud en la ventana de 60 días antes a 90 después."}, {"lvl": "avanzado", "q": "¿Cuál es la duración máxima total (incluida posible renovación) de la residencia para prácticas?", "opts": ["1 año, sin posibilidad de renovación", "Hasta 12 meses renovable una vez, sin exceder un total de 2 años", "6 meses, improrrogables en todo caso", "3 años, sin límite de renovaciones sucesivas"], "a": 1, "exp": "Residencia para prácticas: 12 meses, renovable una vez, tope de 2 años en total."}, {"lvl": "basico", "q": "¿A partir de qué edad puede un extranjero solicitar autorización de trabajo por cuenta propia?", "opts": ["16 años", "18 años", "21 años", "No se exige edad mínima para esta autorización"], "a": 1, "exp": "Trabajo por cuenta propia: mayor de 18 años."}, {"lvl": "basico", "q": "¿A partir de qué edad puede trabajar por cuenta ajena un extranjero con contrato u oferta de empleo?", "opts": ["16 años", "18 años, igual que para el trabajo por cuenta propia", "21 años, coincidiendo con la mayoría de edad plena", "14 años, sin necesidad de autorización adicional"], "a": 0, "exp": "Trabajo por cuenta ajena: mayor de 16 años."}, {"lvl": "medio", "q": "¿Cuál es la duración de la autorización inicial de trabajo (cuenta propia o ajena) y su posible renovación?", "opts": ["6 meses, renovable por un periodo de 1 año", "1 año, renovable por 4 años, y tras 5 años se puede optar a la RLD", "2 años, sin posibilidad de renovación posterior", "Indefinida desde el momento de su concesión inicial"], "a": 1, "exp": "Autorización inicial de En un plazo fijo de 15 días, con independencia de la estancia restante", "En un plazo de 30 días desde la notificación de la denegación", "En el plazo de 15 días desde que se dictó la denegación"], "a": 0, "exp": "Denegación de prórroga: debe salir en el plazo de estancia restante o, como máximo, en 72 horas."}, {"lvl": "avanzado", "q": "Para una autorización de estancia de larga duración solicitada dentro de España, ¿con qué antelación mínima debe presentarse la solicitud y en qué plazo se resuelve?", "opts": ["Sin antelación mínima; resolución en un plazo de 30 días", "Antelación mínima de 2 meses; resolución en máximo 7 días (silencio negativo) o 15 días según el caso", "Antelación mínima de 6 meses; resolución en el plazo de 1 mes", "No cabe solicitar la estancia de larga duración estando dentro de España"], "a": 1, "exp": "Antelación mínima de 2 meses; resolución en 7 días (antes del inicio) o 15 días (antes de la expiración de su situación), silencio negativo en ambos casos."}, {"lvl": "medio", "q": "¿Con cuántos días naturales de validez restante como mínimo pueden solicitar los familiares de un titular de estancia por estudios superiores su propio visado o autorización de estancia?", "opts": ["30 días naturales de validez restante como mínimo", "90 días naturales de validez restante como mínimo", "180 días naturales de validez restante como mínimo", "No se exige un mínimo de validez restante para esta solicitud"], "a": 1, "exp": "Los familiares (cónyuge o hijos) necesitan como mínimo 90 días naturales de validez restantes."}], "75": [{"lvl": "avanzado", "q": "¿Qué colectivos pueden trabajar en España sin necesidad de autorización de trabajo?", "opts": ["Únicamente los turistas en régimen de estancia de corta duración", "Directivos desplazados, profesores/técnicos/científicos invitados, investigadores, estudiantes en prácticas regladas, corresponsales, artistas puntuales, funcionarios en misión, religiosos, deportistas profesionales, entre otros", "Únicamente on carácter general", "5 años, con carácter general", "10 años, con carácter general"], "a": 1, "exp": "El retornado voluntariamente asume, por lo general, un compromiso de no retorno de 3 años."}, {"lvl": "avanzado", "q": "¿Qué requisito de horas semanales exige, como mínimo, el arraigo sociolaboral?", "opts": ["Cualquier contrato de trabajo, sin exigencia de un mínimo de horas", "Contrato/os que sumen al menos 20 horas semanales, al menos al SMI o convenio", "40 horas semanales a jornada completa, sin excepción", "10 horas semanales, con retribución libremente pactada"], "a": 1, "exp": "Arraigo sociolaboral: contrato(s) que sumen al menos 20 horas semanales, retribuidos como mínimo al SMI o convenio, admitiendo varios contratos simultáneos o estacionales."}, {"lvl": "avanzado", "q": "Ante una posible víctima de trata de seres humanos (TSH), ¿en qué plazo debe elevarse la propuesta de periodo de restablecimiento y reflexión, y cuál es la duración mínima de ese periodo?", "opts": ["24 horas para elevar la propuesta; periodo de al menos 30 días", "48 horas para elevar la propuesta; periodo de al menos 90 días", "7 días para elevar la propuesta; periodo de al menos 60 días", "1 semana para elevar la propuesta; periodo de al menos 60 días"], "a": 1, "exp": "Las unidades de Extranjería deben elevar la propuesta en 48 horas; el periodo de restablecimiento y reflexión es de al menos 90 días."}], "76": [{"lvl": "basico", "q": "¿Cuántos años de residencia legal y continuada se exigen, con carácter general, para la Residencia de Larga Duración (RLD) nacional?", "opts": ["3 años de residencia legal y continuada", "5 años de forma continuada", "10 años de residencia legal y continuada", "2 años de forma continuada"], "a": 1, "exp": "5 años de residencia temporal continuada en España."}, {"lvl": "basico", "q": "¿Se ve afectada la continuidad de la residencia por ausencias por vacaciones?", "opts": ["Sí, siempre se interrumpe la continuidad por cualquier ausencia vacacional", "No, se sigue considerando continua pese a ausencias temporales por vacaciones", "Solo si la ausencia vacacional supera 1 semana continuada", "Depende del país de destino durante las vacaciones"], "a": 1, "exp": "Las vacaciones no interrumpen la continuidad de la residencia a efectos de la RLD."}, {"lvl": "basico", "q": "¿Quiénes pueden acceder a la RLD sin necesidad de cumplir el periodo de 5 años?", "opts": ["Únicamente los turistas con estancia de larga duración", "Jubilados contributivos, beneficiarios de incapacidad absoluta/gran invalidez, nacidos en España con 3 años tras la mayoría de edad, ex-españoles de origen, entre otros", "Nadie puede acceder a la RLD sin cumplir los 5 años de residencia", "Únicamente los estudiantes universitarios con título superior"], "a": 1, "exp": "Acceso directo sin periodo de 5 años para colectivos tasados en el manual."}, {"lvl": "medio", "q": "¿Qué órgano resuelve la RLD directa para quienes hayan contribuido destacadamente al progreso económico, científico o cultural de España?", "opts": ["El Ministerio del Interior, con carácter exclusivo", "El Ministerio de Inclusión, Seguridad Social y Migraciones, previo informe del MI", "El Consejo de Ministros, mediante acuerdo colegiado", "La Comisaría General de Extranjería y Fronteras, sin más trámite"], "a": 1, "exp": "Resuelve el Ministerio de Inclusión, Seguridad Social y Migraciones, previo informe del Ministerio del Interior."}, {"lvl": "medio", "q": "¿Cuántos años de residencia legal, tras la mayoría de edad, se exigen a los nacidos en España para acceder directamente a la RLD?", "opts": ["1 año de residencia legal tras la mayoría de edad", "3 años consecutivos de residencia legal tras la mayoría de edad", "5 años de residencia legal tras la mayoría de edad", "No se exige ningún periodo de residencia tras la mayoría de edad"], "a": 1, "exp": "Nacidos en España: 3 años consecutivos de residencia legal tras la mayoría de edad."}, {"lvl": "medio", "q": "¿Qué extranjeros con RLD en otro Estado miembro pueden solicitar la RLD en España?", "opts": ["Únicamente si acreditan 10 años de residencia legal en la UE", "Pueden solicitarla para trabajar (cuenta propia o ajena) u otros fines, o mantener su RLD en el primer Estado optando por residencia temporal en España", "Únicamente si renuncian previamente a su RLD del primer Estado", "Únicamente si ostentan la nacionalidad de un Estado miembro de la UE"], "a": 1, "exp": "Doble opción para titulares de RLD en otro EM."}, {"lvl": "medio", "q": "¿Cuántos meses de ausencia continuada, sin superar en suma 10 meses en 5 años, no afectan a la continuidad de la residencia con carácter general?", "opts": ["Hasta 3 meses continuados, sin límite acumulado en el quinquenio", "Hasta 6 meses continuados, sin superar 10 meses en total en 5 años", "Hasta 12 meses continuados, sin límite acumulado", "Sin límite alguno, cualquiera que sea la duración de la ausencia"], "a": 1, "exp": "Regla general: 6 meses continuados / máximo 10 meses en 5 años."}, {"lvl": "medio", "q": "¿Cuál es el límite de ausencia por motivos laborales sin afectar a la continuidad de la residencia?", "opts": ["Igual que la regla general de 6 meses/10 meses", "Hasta 6 meses continuados, sin superar 18 meses en total en 5 años", "Hasta 12 meses continuados, sin límite acumulado en 5 años", "Sin límite alguno por motivos laborales"], "a": 1, "exp": "Por motivos laborales: 6 meses continuados / máximo 18 meses en 5 años (más amplio que la regla general)."}, {"lvl": "medio", "q": "¿Cuál es el límite de ausencia para el titular de una Tarjeta Azul-UE sin afectar a la continuidad de residencia?", "opts": ["Hasta 6 meses continuados, sin superar 10 meses en total", "Hasta 12 meses continuados, sin superar 18 meses en 5 años", "Sin límite alguno para los titulares de Tarjeta Azul-UE", "3 meses continuados como máximo, sin cómputo acumulado"], "a": 1, "exp": "Tarjeta Azul-UE: hasta 12 meses continuados / máximo 18 meses en 5 años (igual que motivos laborales r"], "a": 1, "exp": "Listado tasado de causas de extinción de la RLD nacional."}, {"lvl": "avanzado", "q": "¿Puede recuperarse la RLD una vez extinguida?", "opts": ["No, la extinción de la RLD es irreversible en todo caso", "Sí, mediante un procedimiento simplificado", "Solo mediante recurso directo ante el Tribunal Supremo", "Solo transcurridos 10 años desde la extinción"], "a": 1, "exp": "Cabe recuperación vía procedimiento simplificado."}, {"lvl": "avanzado", "q": "¿En qué se basa jurídicamente la Residencia de Larga Duración-UE (RLD-UE)?", "opts": ["En el RD 240/2007, sobre régimen comunitario", "En la Directiva 2003/109/CE", "Exclusivamente en la LO 4/2000", "En el Convenio de aplicación del Acuerdo de Schengen"], "a": 1, "exp": "RLD-UE se ampara en la Directiva 2003/109/CE."}, {"lvl": "avanzado", "q": "¿Qué porcentaje de cómputo tienen los periodos de estudios, voluntariado o formación para la RLD-UE?", "opts": ["Computan al 100%, igual que cualquier otro periodo de residencia", "Computan al 50%", "Computan al 25% del tiempo efectivamente cursado", "No computan en absoluto para el cómputo de los 5 años"], "a": 1, "exp": "Los periodos de estudios/voluntariado/formación computan al 50% para los 5 años exigidos."}, {"lvl": "avanzado", "q": "¿Cuántos años de residencia en la UE (y cuántos en España) se exigen a un titular de Tarjeta Azul-UE de otro EM para pedir la RLD-UE?", "opts": ["5 años de residencia legal en la UE, sin exigencia específica en España", "5 años de residencia legal en la UE, de los cuales al menos 2 en España", "10 años de residencia legal en la UE, sin exigencia en España", "3 años de residencia en cualquier Estado miembro, sin más requisitos"], "a": 1, "exp": "5 años en la UE con movilidad Ley 14/2013, de los cuales mínimo 2 años en España."}, {"lvl": "avanzado", "q": "¿Cuál es la causa adicional de extinción de la RLD-UE frente a la RLD nacional?", "opts": ["No existe ninguna diferencia entre las causas de extinción de ambas", "La ausencia ininterrumpida del territorio español durante 6 años (salvo excepción), añadida a las causas comunes", "Únicamente se extingue por obtención fraudulenta del título", "Se extingue automáticamente al cumplirse 10 años desde su concesión"], "a": 1, "exp": "RLD-UE se extingue además por ausencia ininterrumpida de España de 6 años."}, {"lvl": "basico", "q": "¿Qué es un MENA?", "opts": ["Cualquier extranjero mayor de edad que carezca de recursos económicos", "Extranjero menor de 18 años que llega a España sin estar acompañado por un adulto responsable, o que estando aquí se detecta en desprotección", "Un menor de nacionalidad española que carece de tutor legal", "Un solicitante de protección internacional mayor de edad"], "a": 1, "exp": "Definición de Menor Extranjero No Acompañado (MENA)."}, {"lvl": "medio", "q": "¿En qué plazo debe inscribirse a un menor en el Registro de MENA, según el Plan de Contingencia Solidaria?", "opts": ["24 horas desde su localización", "48 horas desde su localización", "15 días desde su localización", "1 mes desde su localización"], "a": 0, "exp": "Inscripción en el Registro MENA en un máximo de 24 horas."}, {"lvl": "medio", "q": "¿En qué plazo se trasladará al menor a la comunidad que determine el Estado, según el Plan de Contingencia Solidaria?", "opts": ["24 horas desde su inscripción en el registro", "15 días desde su inscripción en el registro", "1 mes desde su inscripción en el registro", "1 mes y 15 días desde su inscripción en el registro"], "a": 1, "exp": "Traslado en máximo 15 días desde la inscripción registral, con participación del Ministerio."}, {"lvl": "medio", "q": "Cuando existe duda sobre la edad de un posible menor, ¿a quién se comunica de forma inmediata y con qué carácter se realizan las pruebas médicas?", "opts": ["A la Comisaría Local, sin necesidad de carácter urgente", "Al Ministerio Fiscal, quien dispone la determinación de la edad; las instituciones sanitarias la realizan con carácter prioritario y urgente", "Al Juez ación Social de los Inmigrantes", "El Observatorio Español del Racismo y la Xenofobia", "La Comisión Laboral Tripartita de Inmigración", "El Registro Central de Extranjeros"], "a": 2, "exp": "La Comisión Laboral Tripartita de Inmigración: informe semestral, consulta sobre catálogo de ocupaciones y contratación en origen."}, {"lvl": "basico", "q": "¿Qué órgano es de consulta, información y asesoramiento en materia de integración de inmigrantes, con composición tripartita?", "opts": ["El Foro para la Integración Social de los Inmigrantes", "El Observatorio Español del Racismo y la Xenofobia", "La Comisión Laboral Tripartita, adscrita al Ministerio de inmigración", "El Ministerio del Interior, a través de su Secretaría de Estado"], "a": 0, "exp": "El Foro para la Integración Social de los Inmigrantes: consulta, información y asesoramiento, informe anual.", "oficial": "convocatoria histórica, fuente: recopilatorio de exámenes oficiales"}, {"lvl": "medio", "q": "Cuando las FCS localizan a un extranjero indocumentado cuya minoría de edad no puede establecerse con seguridad, ¿qué procede?", "opts": ["Darle, durante las primeras 24 horas, el mismo trato que a un adulto hasta que el Ministerio Fiscal determine su edad", "Darle de inmediato, a través de los servicios competentes de protección de menores, la atención que precise conforme a la legislación de protección jurídica del menor, mientras se determina su edad", "Aplicarle el mismo trato que a un apátrida o refugiado hasta que se determine su edad", "Expulsarlo cautelarmente hasta que se resuelva la duda sobre su edad"], "a": 1, "exp": "Ante la duda, se pone el hecho en conocimiento del Ministerio Fiscal y, mientras se determina la edad, se le da de inmediato la atención de los servicios de protección de menores; bastando que la horquilla sitúe al sujeto por debajo de 18 años para considerarlo menor.", "oficial": "convocatoria histórica, fuente: recopilatorio de exámenes oficiales"}, {"lvl": "avanzado", "q": "Para la Residencia de Larga Duración nacional (RLD), ¿qué ausencias del territorio no afectan a la continuidad de la residencia 'con carácter general'?", "opts": ["Hasta 3 meses continuados, sin límite acumulado en el quinquenio", "Hasta 6 meses continuados, que en suma no superen los 10 meses en un período de 5 años", "Hasta 1 año continuado, sin límite acumulado en el quinquenio", "Cualquier ausencia, sin restricción de tiempo"], "a": 1, "exp": "Regla general de continuidad de la RLD: hasta 6 meses continuados, máximo 10 meses acumulados en 5 años (18 meses si es por motivos laborales; 12/18 para Tarjeta Azul-UE)."}, {"lvl": "avanzado", "q": "¿Por ausencia de cuánto tiempo del territorio de la UE se extingue la RLD nacional, con carácter general, y qué plazo especial se aplica a familiares y titulares de Tarjeta Azul-UE?", "opts": ["6 meses; 12 meses para familiares y titulares de Tarjeta Azul-UE", "12 meses consecutivos; 24 meses para familiares y titulares de Tarjeta Azul-UE", "2 años en todo caso, sin excepciones para ningún colectivo", "Por ausencia ininterrumpida de 3 años del territorio español"], "a": 1, "exp": "Extinción de la RLD por ausencia de la UE de 12 meses consecutivos, ampliado a 24 meses para familiares y titulares de Tarjeta Azul-UE."}, {"lvl": "medio", "q": "¿Qué colectivos pueden acceder a la RLD sin necesidad de acreditar el periodo general de 5 años de residencia?", "opts": ["Ningún colectivo tiene acceso directo sin cumplir los 5 años", "Jubilados contributivos de la SS española, beneficiarios de incapacidad absoluta/gran invalidez, nacidos en España con 3 años de residencia legal tras la mayoría de edad, ex-españoles de origen, entre otros", "Únicamente los estudiantes universitarios con título homologado", "Únicamente los reagrupados por vínculo matrimonial"], "a": 1, "exp": "Listado tasado de acceso directo a la RLD sin el periodo general de 5 años."}, {"lvl": "avanzado", "q": "Para obtener la Residencia de Larga Duración-UE (RLD-UE), ¿cómo computan los periodos de estudios, voluntariado o formación dentro de los 5 años de residencia legal exigidos?", "opts": ["No computan en absoluto dentro del periodo de 5 años exigido", "Computan al 50%", "Computan al 100%, igual que cualquier otro periodo de residencia legal", "Computan al 25% del tiempo efectivamente acreditado"], "a": 1, "exp": "Los periodos de estudios, voluntariado o formación se computan al 50% dentro de los 5 años exigidos para la RLD-UE."}], "77": [{"lvl": "basico", "q": "¿Qué conducta tipifica el art. 52.a) como infracción leve?", "opts": ["Trabajar por cuenta ajena sin haber obtenido autorización", "Omisión o retraso en la comunicación de cambios de nacionalidad, estado civil o domicilio", "Falsificar el pasaporte u otro documento de viaje", "Participar en actividades contrarias al orden público previstas como graves"], "a": 1, "exp": "Art. 52.a): omisión/retraso en comunicar cambios de nacionalidad, estado civil o domicilio."}, {"lvl": "medio", "q": "¿Hasta cuántos meses de retraso en la solicitud de renovación de una autorización caducada se considera infracción LEVE?", "opts": ["Hasta 1 mes de retraso", "Hasta 3 meses de retraso", "Hasta 6 meses de retraso", "Hasta 1 año de retraso"], "a": 1, "exp": "Art. 52.b): retraso en la renovación tras caducar, hasta 3 meses (más de 3 meses sería infracción grave del art. 53.1.a)."}, {"lvl": "medio", "q": "Trabajar por cuenta propia sin haber solicitado autorización, contando con residencia temporal, ¿qué tipo de infracción es?", "opts": ["Grave", "Leve", "Muy grave", "No constituye infracción administrativa"], "a": 1, "exp": "Art. 52.c): infracción leve."}, {"lvl": "medio", "q": "Trabajar en una ocupación, sector o ámbito geográfico distinto al contemplado en la autorización, ¿qué tipo de infracción es?", "opts": ["Grave (art. 53.1)", "Leve (art. 52.d)", "Muy grave (art. 54.1)", "No constituye infracción, al tratarse de la misma autorización"], "a": 1, "exp": "Art. 52.d): infracción leve."}, {"lvl": "medio", "q": "¿Qué infracción leve del 'orden social' se comete por cada trabajador extranjero cuya autorización no le habilite para esa ocupación o ámbito?", "opts": ["Se sanciona con una única multa global, con independencia del número de trabajadores", "Se incurre en 1 infracción por cada trabajador extranjero ocupado en tales condiciones (art. 52.e)", "No constituye infracción administrativa en ningún caso", "Se califica siempre como infracción muy grave del orden social"], "a": 1, "exp": "Art. 52.e): infracción individualizada por cada trabajador afectado."}, {"lvl": "medio", "q": "¿Qué infracción leve recae sobre quien omite avisar de la presencia de un MENA que atiende?", "opts": ["Art. 52.f)", "Art. 53.1.a)", "Art. 54.1.a)", "No está tipificada como infracción administrativa"], "a": 0, "exp": "Art. 52.f): omisión de aviso sobre menores extranjeros no acompañados a las autoridades."}, {"lvl": "medio", "q": "Encontrarse irregularmente en España por tener la autorización de residencia caducada más de 3 meses sin haber solicitado la renovación, ¿qué tipo de infracción es?", "opts": ["Leve, al tratarse de un simple retraso administrativo", "Grave (art. 53.1.a)", "Muy grave, por afectar al orden público", "No constituye infracción si supera los 6 meses"], "a": 1, "exp": "Art. 53.1.a): infracción grave, con procedimiento ordinario o preferente según el caso."}, {"lvl": "medio", "q": "Trabajar en España sin haber obtenido autorización, cuando además no se cuenta con autorización de residencia válida, ¿qué tipo y artículo de infracción es?", "opts": ["Leve, art. 52.c)", "Grave, art. 53.1.b)", "Muy grave, art. 54.1.d)", "No constituye infracción administrativa"], "a": 1, "exp": "Art. 53.1.b): infracción grave del orden social."}, {"lvl": "medio", "q": "¿Qué recoge el art. 53.1.d) como infracción grave preferente?", "opts": ["La falsedad en los datos del padrón municipal", "El incumplimiento de medidas de seguridad pública, presentación periódica o alejamiento de fronteras/núcleos de población", "El retraso en solicitar la renovación de una autorización caducada", "La contratación irregular de trabajadores extranjeros"], "a": 1, "exp": "Art. 53.1.d): incumplimiento de medidas de seguridad pública impuestas singularmente."}, {"lvl": "medio", "q": "¿Qué infracción grave recoge el art. 53.1.f)?", "opts": ["Trabajar en España sin haber obtenido autorización", "La participación en actividades contrarias al orden público previstas como graves en la LOPSC", "La falsedad en los datos del padrón municipal", "El incumplimiento de la obligación de obtención de la TIE"], "a": 1, "exp": "Art. 53.1.f): remisión a las infracciones graves de la LOPSC."}, {"lvl": "medio", "q": "¿Qué infracción grave recoge el art. 53.1.h)?", "opts": ["Incumplir la obligación de obtención de la TIE", "Trabajar en España sin haber obtenido autorización", "La discriminación racial, étnica o religiosa", "El matrimonio simulado con ánimo de lucro"], "a": 1, "exp": "Art. 53.1.h): incumplimiento de la obligación de obtención de la TIE."}, {"lvl": "medio", "q": "¿Qué recoge el art. 53.2.d) como infracción grave del orden social?", "opts": ["La contratación irregular masiva de trabajadores extranjeros", "Consentir la inscripción de un extranjero en el Padrón por el titular de una vivienda que no es su domicilio real (una infracción por cada inscrito)", "El retraso en el alta en la Seguridad Social del trabajador", "La falsedad documental grave en el padrón municipal"], "a": 1, "exp": "Art. 53.2.d): infracción por cada persona indebidamente empadronada."}, {"lvl": "avanzado", "q": "¿Qué convierte una tercera infracción leve en una infracción de nivel superior?", "opts": ["Nada, sigue calificándose como infracción leve", "La comisión de una 3ª infracción leve de la misma naturaleza en el plazo de 1 año, tras haber sido sancionado por 2 leves de igual naturaleza, se convierte en grave (art. 53.1.e)", "Se convierte directamente en infracción muy grave", "Se convierte en delito penal, con remisión al Ministerio Fiscal"], "a": 1, "exp": "Art. 53.1.e): la reincidencia (3ª leve en 1 año) se sanciona como grave."}, {"lvl": "avanzado", "q": "¿Qué convierte una tercera infracción grave en una infracción muy grave?", "opts": ["Nada, sigue calificándose como infracción grave", "La comisión de una 3ª infracción grave de la misma naturaleza en 1 año, tras haber sido sancionado por 2 graves de igual naturaleza", "Se sanciona exactamente igual que la primera infracción grave", "Se convierte directamente en delito penal"], "a": 1, "exp": "Reincidencia agravada análoga: 3ª grave en 1 año → muy grave."}, {"lvl": "avanzado", "q": "¿Qué conducta del art. 54.1.b) LOEX se considera infracción muy grave y quién puede cometerla?", "opts": ["Únicamente las empresas de transporte de viajeros", "Inducir, promover, favorecer o facilitar con ánimo de lucro la inmigración clandestina, individualmente o en organización, siempre que no constituya delito", "Cualquier retraso administrativo en la renovación de autorizaciones", "Los turistas que superan el periodo de su estancia autorizada"], "a": 1, "exp": "Art. 54.1.b): favorecimiento con ánimo de lucro de inmigración clandestina, si no constituye delito."}, {"lvl": "avanzado", "q": "¿Qué infracción muy grave recoge el art. 54.1.a)?", "opts": ["Trabajar en España sin haber obtenido autorización", "Participar en actividades contrarias a la seguridad nacional, perjudicar relaciones exteriores de España, o actividades muy graves de la LOPSC", "El matrimonio simulado con ánimo de lucro", "La discriminación laboral por motivos raciales"], "a": 1, "exp": "Art. 54.1.a): infracción muy grave, competencia de resolución del Comisario General en su caso."}, {"lvl": "avanzado", "q": "¿Qué infracción muy grave del orden social recoge el art. 54.1.d), y cómo se computa?", "opts": ["Una infracción global, sin importar el número de trabajadores afectados", "La contratación de trabajadores extranjeros sin autorización de residencia y trabajo, con una infracción por cada trabajador ocupado, si no constituye delito", "Se sanciona únicamente al trabajador, nunca al empleador", "No está tipificada como infracción muy grave del orden social"], "a": 1, "exp": "Art. 54.1.d): infracción individualizada por cada trabajador contratado irregularmente."}, {"lvl": "avanzado", "q": "¿Qué recoge el art. 54.1.e) como infracción muy grave?", "opts": ["Realizar, con ánimo de lucro, la inscripción de un extranjero en el Padrón Municipal", "La discriminación racial, étnica o religiosa", "El matrimonio simulado con propósito de obtener residencia", "El transporte ilegal de personas hasta territorio español"], "a": 0, "exp": "Art. 54.1.e): empadronamiento fraudulento con ánimo de lucro, infracción muy grave."}, {"lvl": "avanzado", "q": "Contraer matrimonio simulado o simular relación afectiva análoga con ánimo de lucro o para obtener indebidamente residencia, sin constituir delito, ¿qué tipo de infracción es?", "opts": ["Leve, al no exigirse ánimo de lucro cualificado", "Grave (art. 53.2.b)", "Muy grave, por afectar a la seguridad del Estado", "No es infracción administrativa, solo penal"], "a": 1, "exp": "Art. 53.2.b): infracción grave si no constituye delito (de lo contrario sería delito penal)."}, {"lvl": "avanzado", "q": "¿Qué recoge el art. 53.2.c) como infracción grave?", "opts": ["Trabajar en España sin haber obtenido autorización", "Promover la permanencia irregular de un extranjero cuya entrada legal contó con invitación expresa del infractor, y que continúe a su cargo tras el periodo permitido", "La falsedad documental grave en los datos del padrón", "El matrimonio simulado con ánimo de lucro"], "a": 1, "exp": "Art. 53.2.c): responsabilidad del invitante que mantiene a su cargo al extranjero tras vencer su permiso."}, {"lvl": "avanzado", "q": "¿Qué recoge el art. 54.2.c) sobre las obligaciones de los transportistas?", "opts": ["Únicamente se aplica cuando el transportista es de nacionalidad española", "El incumplimiento de la obligación de hacerse cargo sin pérdida de tiempo del extranjero transportado con deficiencias documentales o no autorizado, incluidos los gastos de mantenimiento y, en su caso, de transporte", "Únicamente afecta al transporte realizado por vía aérea", "Únicamente se aplica cuando el extranjero transportado es menor de edad"], "a": 1, "exp": "Art. 54.2.c): obligación de asunción inmediata de responsabilidad y gastos por parte del transportista."}, {"lvl": "medio", "q": "Según el art. 52 (infracciones leves), ¿hasta cuándo puede retrasarse la solicitud de renovación de una autorización caducada sin incurrir en infracción grave?", "opts": ["Hasta 1 mes desde la caducidad de la autorización", "Hasta 3 meses desde la caducidad de la autorización", "Hasta 6 meses desde la caducidad de la autorización", "No hay plazo, siempre se califica como infracción leve"], "a": 1, "exp": "Art. 52.b): el retraso en solicitar la renovación una vez caducada la autorización, hasta 3 meses, es infracción leve."}, {"lvl": "medio", "q": "¿A partir de qué momento encontrarse sin autorización de residencia (o con ella caducada) constituye la infracción grave del art. 53.1.a)?", "opts": ["Inmediatamente al producirse la caducidad de la autorización", "Cuando la autorización lleve caducada más de 3 meses sin haberse solicitado la renovación en plazo", "A partir de que se cumpla 1 año desde la caducidad", "Sigue siendo infracción leve hasta que se cumplan 6 meses de caducidad"], "a": 1, "exp": "Art. 53.1.a): encontrarse irregularmente en España por carecer de autorización o tenerla caducada más de 3 meses sin solicitud de renovación en plazo."}, {"lvl": "medio", "q": "¿Qué infracción tipifica el art. 53.1.g) sobre las salidas del territorio español?", "opts": ["No existe ninguna infracción relacionada con las salidas del territorio", "Las salidas por puestos no habilitados, sin exhibir documentación o contraviniendo prohibiciones", "El retraso en solicitar la renovación de una autorización caducada", "No inscribirse en el padrón municipal del domicilio habitual"], "a": 1, "exp": "Art. 53.1.g): infracción grave por salidas del territorio español por puestos no habilitados, sin exhibir documentación o contraviniendo prohibiciones."}, {"lvl": "medio", "q": "¿Qué ocurre cuando un extranjero comete una 3ª infracción leve de la misma naturaleza en el plazo de 1 año, tras haber sido sancionado por 2 leves anteriores?", "opts": ["Sigue calificándose como infracción leve, sin agravación", "Se convierte en infracción grave (art. 53.1.e)", "Prescribe automáticamente, sin posibilidad de sanción", "Se archiva sin sanción, al tratarse de infracciones leves"], "a": 1, "exp": "Art. 53.1.e): la comisión de una 3ª infracción leve de la misma naturaleza en el plazo de 1 año, tras 2 sanciones leves previas, se sanciona como grave."}, {"lvl": "avanzado", "q": "¿Qué infracción tipifica el incumplimiento de la obligación de obtener la TIE?", "opts": ["Es infracción leve en todo caso", "Infracción grave del art. 53.1.h)", "No está tipificada como infracción administrativa", "Solo constituye infracción si se reitera en 3 ocasiones distintas"], "a": 1, "exp": "Art. 53.1.h): incumplir la obligación de obtención de la TIE es infracción grave."}], "78": [{"lvl": "medio", "q": "¿Qué órgano inicia el procedimiento sancionador cuando se trata de infracciones del 'orden social' (52.c,d,e; 53.1.b; 53.2.a; 54.1.d,f)?", "opts": ["El Juez de Instrucción del domicilio del infractor", "La Inspección de Trabajo y Seguridad Social, mediante acta", "La Comisaría Local, sin necesidad de acta previa", "El Ministerio Fiscal, mediante denuncia formal"], "a": 1, "exp": "El procedimiento de orden social se inicia por acta de la Inspección de Trabajo y Seguridad Social."}, {"lvl": "medio", "q": "¿Cuáles son las 4 formas de iniciación del procedimiento sancionador en extranjería?", "opts": ["Únicamente de oficio, sin más vías de iniciación", "De oficio por acuerdo del órgano competente, por propia iniciativa, a petición razonada de otros órganos, por denuncia, o por orden superior", "Únicamente por denuncia formulada por un particular", "Únicamente por orden judicial motivada"], "a": 1, "exp": "Formas de iniciación tasadas en el procedimiento sancionador."}, {"lvl": "avanzado", "q": "¿Quiénes pueden ser nombrados instructor y secretario en el acuerdo de incoación?", "opts": ["Cualquier funcionario público de la Administración General del Estado", "Funcionarios del CNP o de las Oficinas de Extranjería", "Únicamente abogados del Estado adscritos a la provincia", "Únicamente jueces de instrucción del partido judicial"], "a": 1, "exp": "Nombramiento restringido a funcionarios del CNP o de las OEX."}, {"lvl": "basico", "q": "¿Cuál es el rango de multa para infracciones GRAVES en extranjería?", "opts": ["Hasta 500 euros", "De 501 a 10.000 euros", "De 10.001 a 100.000 euros", "No lleva aparejada multa económica"], "a": 1, "exp": "Art. 53: infracciones graves, multa de 501 a 10.000 euros; además pueden llevar expulsión."}, {"lvl": "basico", "q": "¿Cuál es el rango de multa para infracciones MUY GRAVES?", "opts": ["De 501 a 10.000 euros", "De 1.000 a 20.000 euros", "De 10.001 a 100.000 euros", "Sin límite máximo establecido legalmente"], "a": 2, "exp": "Infracciones muy graves: de 10.001 a 100.000 euros."}, {"lvl": "basico", "q": "¿Qué criterios sigue el órgano competente para graduar las sanciones?", "opts": ["Únicamente el importe económico acreditado del infractor", "Proporcionalidad, valorando grado de culpabilidad, daño producido o riesgo derivado de la infracción y su trascendencia", "Únicamente la reincidencia en infracciones de igual naturaleza", "Únicamente la reincidencia genérica, sin más factores de graduación"], "a": 1, "exp": "Criterios de proporcionalidad para graduar las sanciones."}, {"lvl": "basico", "q": "¿Qué se tiene especialmente en cuenta para determinar la cuantía de la multa?", "opts": ["El país de origen del infractor", "La capacidad económica del infractor", "El idioma que hable habitualmente el infractor", "La edad del infractor en el momento de la infracción"], "a": 1, "exp": "Determinación de cuantía atendiendo especialmente a la capacidad económica."}, {"lvl": "medio", "q": "¿Cuál es el plazo de prescripción de una infracción LEVE y de su sanción?", "opts": ["3 meses / 6 meses", "6 meses / 1 año", "1 año / 2 años", "2 años / 3 años"], "a": 1, "exp": "Infracción leve: prescribe a los 6 meses; la sanción, al año."}, {"lvl": "medio", "q": "¿Cuál es el plazo de prescripción de una infracción GRAVE y de su sanción?", "opts": ["1 año / 1 año", "2 años / 2 años", "3 años / 3 años", "6 meses / 2 años"], "a": 1, "exp": "Infracción y sanción graves: 2 años ambas.", "oficial": "convocatoria histórica, fuente: recopilatorio de exámenes oficiales"}, {"lvl": "medio", "q": "¿Cuál es el plazo de prescripción de la infracción y de la sanción MUY GRAVE?", "opts": ["2 años / 2 años", "3 años (infracción) / 5 años (sanción)", "1 año / 1 año", "5 años / 5 años"], "a": 1, "exp": "Infracción muy grave prescribe a los 3 años; la sanción, a los 5 años."}, {"lvl": "medio", "q": "¿Desde cuándo se inicia con carácter general el cómputo de la prescripción de la infracción?", "opts": ["Desde la firmeza de la resolución sancionadora", "Desde la comisión de la infracción", "Desde la notificación de la resolución al interesado", "Desde que la Administración detecta la infracción, sin importar cuándo se cometió"], "a": 1, "exp": "Cómputo general desde el momento de la comisión."}, {"lvl": "medio", "q": "¿Desde cuándo comienza a ser firme la sanción a efectos de su propio plazo de prescripción?", "opts": ["El mismo día en que se dicta la resolución", "Al día siguiente de ser firme", "A los 10 días de notificarse la resolución", "Desde los 10 días siguientes a la notificación"], "a": 1, "exp": "La sanción comienza a ser firme al día siguiente, momento clave para el cómputo de su prescripción."}, {"lvl": "avanzado", "q": "Si la sanción impuesta es una expulsión, ¿cuándo empieza a contar el plazo de prescripción de la sanción?", "opts": ["Desde el día siguiente a ser firme la resolución de expulsión", "No comenzará a contar hasta que haya transcurrido el periodo de prohibición de entrada", "Desde el momento de la ejecución material de la expulsión", "Prescribe a los 5 años desde su imposición, sin excepción por prohibición de entrada"], "a": 1, "exp": "Particularidad: el cómputo de prescripción de la sanción de expulsión se retrasa hasta agotar la prohibición de entrada."}, {"lvl": "avanzado", "q": "¿Cuál es la multa específica del art. 54.2.a) por cada viaje sin comunicar (o comunicar erróneamente) los datos de pasajeros transportados?", "opts": ["De 500 a 1.000 euros por viaje", "De 5.000 a 10.000 euros por viajero", "De 10.001 a 100.000 euros por viaje, sin perjuicio de incautación/decomiso", "750.000 euros fijos por infracción"], "a": 2, "exp": "Art. 54.2.a): multa de 10.001 a 100.000 euros por viaje incumplido."}, {"lvl": "avanzado", "q": "¿Cuál es la sanción del art. 54.2.b) LOEX por viajero, o alternativamente a tanto alzado?", "opts": ["De 500 a 1.000 euros por viajero", "De 5.000 a 10.000 euros por viajero, o hasta 750.000 euros a tanto alzado", "1.000 euros fijos, sin distinción por número de viajeros", "De 1.000 a 5.000 euros por viajero, sin importe a tanto alzado alternativo"], "a": 1, "exp": "Art. 54.2.b): 5.000-10.000 € por viajero o hasta 750.000 € a tanto alzado."}, {"lvl": "avanzado", "q": "Además de la multa, ¿qué otras 3 sanciones posibles existen en materia de extranjería?", "opts": ["Únicamente existe la sanción de multa económica", "La expulsión, el decomiso (solo inmigración clandestina) y la clausura del local (solo orden social)", "Únicamente la sanción de expulsión del territorio", "Únicamente la clausura del establecimiento infractor"], "a": 1, "exp": "Sanciones posibles: multa, expulsión, decomiso (inmigración clandestina) y clausura (orden social)."}, {"
