1, "exp": "El Juez puede actuar de oficio, a instancia de parte o del MF para ordenar la libertad."}, {"lvl": "avanzado", "q": "¿Qué ocurre si, tras acordado el internamiento, dejan de cumplirse las condiciones que lo motivaron?", "opts": ["Continúa igualmente el internamiento hasta agotar los 60 días", "El extranjero debe ser puesto inmediatamente en libertad, comunicándolo al Juez que autorizó el internamiento", "Se traslada automáticamente a otro CIE de distinta provincia", "Se prorroga el internamiento otros 60 días adicionales"], "a": 1, "exp": "Puesta en libertad inmediata y comunicación al Juez autorizante si desaparecen las condiciones."}, {"lvl": "basico", "q": "¿Cuál es el importe máximo de multa para una infracción LEVE en materia de extranjería?", "opts": ["Hasta 500 euros", "Hasta 1.000 euros", "Hasta 10.000 euros", "No lleva aparejada multa económica"], "a": 0, "exp": "Art. 52 LOEX: infracciones leves, multa de hasta 500 euros."}], "79": [{"lvl": "medio", "q": "En el procedimiento preferente de expulsión del art. 57.1 LOEX, ¿cuándo se ejecuta la expulsión?", "opts": ["En un plazo de 30 días desde la resolución", "De forma inmediata", "En 72 horas en todo caso", "Tras un plazo voluntario de 1 mes"], "a": 1, "exp": "En procedimiento preferente la expulsión se efectúa de forma inmediata."}, {"lvl": "medio", "q": "¿Cuál es el plazo voluntario de salida en el procedimiento ordinario del art. 57.1 LOEX?", "opts": ["De forma inmediata, sin plazo voluntario", "De 7 a 30 días", "48 horas desde la notificación", "60 días desde la notificación"], "a": 1, "exp": "Plazo voluntario de 7 a 30 días en procedimiento ordinario; tras expirar, ejecución inmediata."}, {"lvl": "avanzado", "q": "En el art. 57.7 LOEX (causas judiciales pendientes), ¿en qué plazo máximo debe pronunciarse el Juez sobre la autorización de expulsión de un procesado/imputado?", "opts": ["24 horas desde que se le da traslado", "No superior a 3 días", "15 días desde que se le da traslado", "1 mes desde que se le da traslado"], "a": 1, "exp": "Plazo más breve posible y en todo caso no superior a 3 días, previa audiencia del Ministerio Fiscal."}, {"lvl": "avanzado", "q": "Si el extranjero está sujeto a varios procesos penales en distintos juzgados y todos constan en el expediente de expulsión, ¿qué debe hacer la autoridad gubernativa?", "opts": ["Ignorar los procesos adicionales y tramitar solo el principal", "Instar la autorización de todos ellos", "Tramitar únicamente el proceso penal más grave", "Suspender indefinidamente el expediente de expulsión"], "a": 1, "exp": "Debe instarse la autorización judicial de todos los procesos pendientes acreditados."}, {"lvl": "avanzado", "q": "¿Qué ocurre si un extranjero es detenido en España y consta una resolución de expulsión de otro Estado miembro (art. 64.4)?", "opts": ["Se abre un nuevo expediente de expulsión en España", "Se ejecuta inmediatamente la resolución del otro EM sin necesidad de nuevo expediente, pudiendo solicitarse ingreso en centro de internamiento al Juez de Instrucción", "Se le concede automáticamente protección internacional", "No se puede actuar sin autorización previa del otro Estado"], "a": 1, "exp": "Ejecución directa de la resolución de expulsión de otro EM sin incoar nuevo expediente en España."}, {"lvl": "avanzado", "q": "¿Qué dos supuestos del art. 64.6 no requieren expediente de expulsión?", "opts": ["Los solicitantes de protección internacional y los turistas", "Traslados escoltados de solicitantes de protección internacional inadmitidos, y traslados escoltados en tránsito por repatriación/alejamiento vía aérea", "Los menores extranjeros no acompañados y las personas de avanzada edad", "Ningún supuesto está exento de tramitar expediente de expulsión"], "a": 1, "exp": "Los dos supuestos tasados del art. 64.6 LOEX."}, {"lvl": "basico", "q": "¿Pueden imponerse conjuntamente las sanciones de expulsión y multa a un mismo extranjero por los mismos hechos?", "opts": ["Sí, siempre que ambas sanciones estén debidamente motivadas", "No, en ningún caso podrán imponerse conjuntamente", "Sí, cuando el extranjero sea reincidente", "Solo cuando se trate de infracciones calificadas como muy graves"], "a": 1, "exp": "'En ningún caso podrá imponerse conjuntamente las sanciones de expulsión y multa.'"}, {"lvl": "basico", "q": "¿Qué conlleva en todo caso la expulsión respecto a otras autorizaciones del extranjero?", "opts": ["Nada, ambas situaciones son jurídicamente independientes", "La extinción de cualquier autorización para permanecer legalmente en España, o el archivo", "Únicamente afecta a la vigencia del visado de turista", "La suspensión temporal por un plazo de 6 meses"], "a": 1, "exp": "La expulsión conlleva la extinción de cualquier autorización legal o su archivo."}, {"lvl": "basico", "q": "Si un extranjero en situación irregular (53.1 a o b) es titular de autorización de residencia en otro Estado miembro, ¿qué se le advierte?", "opts": ["Se le concede automáticamente un permiso de trabajo temporal en España", "Mediante diligencia en el pasaporte, la obligación de dirigirse de inmediato a dicho Estado; si no cumple, se le expulsa", "Se le concede automáticamente la residencia en España", "Únicamente se le impone una sanción de multa"], "a": 1, "exp": "Mecanismo de advertencia previa antes de proceder a la expulsión en este supuesto concreto."}, {"lvl": "medio", "q": "¿A qué conductas del art. 53.1 LOEX puede aplicarse la expulsión en lugar de la multa, según el art. 57.1?", "opts": ["Únicamente a las conductas calificadas como muy graves", "A las muy graves y a las graves del art. 53.1 A, B, C, D y F", "Únicamente a las conductas calificadas como leves", "A cualquier infracción, sin excepción alguna"], "a": 1, "exp": "Art. 57.1: muy graves y graves de los apartados A, B, C, D, F del art. 53.1 (según principio de proporcionalidad)."}, {"lvl": "medio", "q": "¿A partir de qué condena (art. 57.2 LOEX) procede la expulsión por conducta dolosa constitutiva de delito?", "opts": ["A partir de cualquier condena, sin exigencia de un mínimo de pena", "Delito sancionado con pena privativa de libertad superior a 1 año", "Únicamente delitos sancionados con pena superior a 5 años", "Únicamente en caso de reincidencia delictiva"], "a": 1, "exp": "Art. 57.2: pena privativa de libertad superior a 1 año (salvo antecedentes cancelados)."}, {"lvl": "medio", "q": "¿Es requisito de la expulsión del art. 57.2 que el delito se haya cometido en España?", "opts": ["Sí, el delito debe haberse cometido necesariamente en España", "No, procede tanto si fue condenado dentro como fuera de España, siempre que la conducta constituya delito en España", "Solo si fue condenado en un Estado miembro de la UE", "Solo cuando el delito sea de terrorismo"], "a": 1, "exp": "El art. 57.2 se aplica a condenas dentro o fuera de España por una conducta dolosa que sea delito en nuestro país."}, {"lvl": "avanzado", "q": "¿Qué tope de pena permite aplicar el art. 57.7 (causas judiciales pendientes)?", "opts": ["Pena privativa de libertad inferior a 6 años, o pena de distinta naturaleza", "Cualquier pena, sin límite máximo", "Únicamente penas superiores a 6 años de prisión", "Únicamente delitos calificados como leves"], "a": 0, "exp": "Art. 57.7: delito con pena privativa de libertad inferior a 6 años, o pena de otra naturaleza."}, {"lvl": "avanzado", "q": "En la expulsión judicial del art. 89 CP, ¿cuál es la regla general para penas de más de 1 año de prisión?", "opts": ["Se cumple la totalidad de la pena, sin excepción", "Sustitución por la expulsión (excepcionalmente, cumplimiento de hasta 2/3 y sustitución del resto)", "Se aplica siempre una multa en sustitución de la pena", "No cabe sustitución alguna en este supuesto"], "a": 1, "exp": "Regla general del art. 89 CP: sustitución de la pena de más de 1 año por expulsión, con la excepción del cumplimiento parcial."}, {"lvl": "avanzado", "q": "En la expulsión judicial del art. 89 CP, si la pena es de más de 5 años, ¿cómo actúa el juez?", "opts": ["Sustituye la totalidad de la pena por expulsión de forma inmediata", "El juez acuerda el cumplimiento de todo o parte de la pena; al llegar al 3er grado o libertad condicional, se sustituye el resto por expulsión", "No es posible acordar la expulsión en penas de esta magnitud", "Se aplica siempre la expulsión sin cumplimiento previo de la pena"], "a": 1, "exp": "Penas >5 años: cumplimiento parcial obligatorio antes de sustituir por expulsión."}, {"lvl": "avanzado", "q": "¿Qué delitos están excluidos de la sustitución de la pena por expulsión conforme al art. 89 CP?", "opts": ["Únicamente el delito de homicidio", "177 bis (trata de seres humanos), 312, 313 y 318 bis CP (tráfico ilegal de mano de obra, favorecimiento fraudulento de emigración/inmigración ilegal)", "Todos los delitos contra el patrimonio, sin excepción", "Únicamente los delitos calificados como leves"], "a": 1, "exp": "Delitos excluidos de la sustitución: 177 bis, 312, 313 y 318 bis CP."}, {"lvl": "avanzado", "q": "¿Cuándo NO procede la sustitución de la pena por expulsión, aun tratándose de un delito no excluido?", "opts": ["Cuando el condenado carece de antecedentes penales previos", "Cuando, a la vista de las circunstancias del hecho y del autor —en particular su arraigo en España—, la expulsión resulte desproporcionada", "Cuando el extranjero condenado es menor de edad", "Cuando el condenado lleva menos de 1 año residiendo en España"], "a": 1, "exp": "Cláusula de proporcionalidad/arraigo que impide la sustitución en determinados casos."}, {"lvl": "avanzado", "q": "¿Cuál es el plazo general de prohibición de entrada 'judicial' tras la expulsión sustitutiva del art. 89 CP?", "opts": ["De 1 a 5 años desde la expulsión", "De 5 a 10 años desde la expulsión", "Siempre 10 años, sin margen de graduación", "De 1 a 3 años desde la expulsión"], "a": 1, "exp": "Plazo general judicial de 5 a 10 años."}, {"lvl": "avanzado", "q": "Si el extranjero regresa a España antes de cumplirse el plazo de prohibición de entrada judicial, ¿qué ocurre en principio?", "opts": ["No ocurre nada, puede permanecer en España sin consecuencias", "Cumplirá la pena sustituida, salvo que el juez reduzca su duración si el cumplimiento resulta innecesario", "Se le expulsa de nuevo, sin más consecuencias penales", "Se abre obligatoriamente un nuevo proceso penal distinto"], "a": 1, "exp": "Regla general: cumplimiento de la pena sustituida, con posible reducción judicial motivada."}, {"lvl": "avanzado", "q": "¿Cuándo procede la expulsión de un ciudadano de la UE que ha residido en España los últimos 10 años, más allá de la amenaza grave general?", "opts": ["Únicamente si lo solicita expresamente el país de origen del condenado", "Si fue condenado por delitos contra vida/libertad/integridad física/indemnidad sexual con pena máxima de prisión de 5 años y riesgo grave de reincidencia, o por terrorismo/organización criminal", "Únicamente por la comisión de infracciones administrativas leves", "Únicamente si consta condena previa por tráfico de drogas"], "a": 1, "exp": "Umbral cualificado para expulsar a comunitarios con 10 años de residencia."}, {"lvl": "basico", "q": "¿Cuánto puede durar, con carácter general, la prohibición de entrada tras una expulsión?", "opts": ["1 año como máximo, sin excepción", "No excederá de 5 años (excepcionalmente hasta 10 años por amenaza grave)", "Siempre 10 años, con independencia de las circunstancias", "No existe límite temporal para la prohibición de entrada"], "a": 1, "exp": "Máximo general 5 años; excepcionalmente hasta 10 años por amenaza grave para orden/seguridad/salud pública."}, {"lvl": "avanzado", "q": "¿En qué casos NO se impone la prohibición de entrada tras una expulsión, según el manual?", "opts": ["Únicamente cuando el extranjero acredita arraigo social", "Cuando el extranjero abandona el territorio durante la tramitación de un expediente sancionador de los supuestos 53.1 A) y B)", "Únicamente cuando el extranjero colabora activamente con la policía", "Únicamente cuando el extranjero acredita arraigo familiar"], "a": 1, "exp": "No se impone si abandona voluntariamente durante la tramitación del expediente por esos supuestos concretos."}, {"lvl": "medio", "q": "¿Cuál es la vigencia máxima ordinaria de la prohibición de entrada administrativa (art. 57.1), y cuál el máximo excepcional?", "opts": ["3 años con carácter ordinario; 5 años con carácter excepcional", "No excederá de 5 años; excepcionalmente hasta 10 años si supone amenaza grave para orden/seguridad/salud pública", "1 año con carácter ordinario; 3 años con carácter excepcional", "Siempre 10 años, sin distinción entre supuesto ordinario y excepcional"], "a": 1, "exp": "Prohibición de entrada administrativa: máximo 5 años con carácter general; hasta 10 años en supuestos de amenaza grave."}, {"lvl": "medio", "q": "Según el art. 57.2 LOEX, ¿a partir de qué pena impuesta por conducta dolosa puede acordarse la expulsión del condenado?", "opts": ["A partir de cualquier pena, sin exigencia de un mínimo", "Pena privativa de libertad superior a 1 año (salvo antecedentes cancelados)", "Únicamente a partir de una pena superior a 3 años", "Únicamente en caso de condena a prisión permanente revisable"], "a": 1, "exp": "Art. 57.2: expulsión del extranjero condenado, dentro o fuera de España, por delito con pena privativa de libertad superior a 1 año, salvo cancelación de antecedentes."}, {"lvl": "avanzado", "q": "En la expulsión judicial sustitutiva del art. 89 CP, ¿hasta qué proporción de la pena de prisión superior a 5 años puede acordar el juez que se cumpla antes de sustituir el resto por expulsión?", "opts": ["La mitad de la pena impuesta", "Dos tercios de la pena impuesta", "Un tercio de la pena impuesta", "La totalidad de la pena, en cualquier caso"], "a": 1, "exp": "Para penas superiores a 5 años, el juez puede acordar el cumplimiento de una parte (hasta 2/3) y sustituir el resto por expulsión al alcanzar el tercer grado o la libertad condicional."}, {"lvl": "avanzado", "q": "¿Qué delitos quedan excluidos de la sustitución de la pena por expulsión conforme al art. 89 CP?", "opts": ["Únicamente los delitos contra la Hacienda Pública", "Trata de seres humanos (177 bis), tráfico ilegal de mano de obra (312), favorecimiento fraudulento de emigración (313) y favorecimiento de inmigración ilegal (318 bis)", "Únicamente los delitos de terrorismo", "Únicamente los delitos contra la salud pública"], "a": 1, "exp": "Delitos excluidos de la sustitución por expulsión (art. 89 CP): arts. 177 bis, 312, 313 y 318 bis CP."}, {"lvl": "avanzado", "q": "¿Cuándo procede expulsar a un ciudadano de la UE que ha residido en España durante los 10 años anteriores, además de existir una amenaza grave para el orden/seguridad pública?", "opts": ["Basta con la comisión de cualquier infracción administrativa grave", "Si ha sido condenado por delitos contra la vida, libertad, integridad física o indemnidad sexual con pena máxima de 5 años y riesgo grave de reincidencia, o por delitos de terrorismo/organización criminal", "Basta con la existencia de cualquier condena penal, sin más requisitos", "Únicamente si lo solicita expresamente el país de origen del condenado"], "a": 1, "exp": "Umbral reforzado para comunitarios con 10 años de residencia: exige, además de la amenaza grave, condena por los delitos tasados con riesgo de reincidencia, o terrorismo/organización criminal."}], "80": [{"lvl": "basico", "q": "¿Puede expulsarse a un ciudadano de la UE o EEE con residencia en España durante los últimos 10 años?", "opts": ["Sí, sin ninguna restricción especial por razón de su residencia", "Solo si existen motivos imperiosos de seguridad pública", "Sí, libremente y sin necesidad de motivo adicional alguno", "Solo si el ciudadano tiene menos de 30 años de edad"], "a": 1, "exp": "Umbral elevado a motivos imperiosos de seguridad pública para residentes de 10 años."}, {"lvl": "medio", "q": "¿En qué plazo se considera reincidencia a efectos de excepcionar la protección frente a la expulsión de estos colectivos?", "opts": ["6 meses", "1 año", "2 años", "No se contempla la reincidencia en este supuesto"], "a": 1, "exp": "Reincidencia en el término de 1 año en infracción de la misma naturaleza sancionable con expulsión."}, {"lvl": "medio", "q": "¿Es necesario tramitar expediente de expulsión para devolver a un extranjero que intenta entrar ilegalmente en el país?", "opts": ["Sí, siempre es necesario tramitar expediente de expulsión", "No, no es necesario expediente de expulsión para la devolución en este supuesto", "Solo si el extranjero es reincidente en el intento de entrada", "Solo si el extranjero tiene antecedentes penales"], "a": 1, "exp": "La devolución por intento de entrada ilegal no exige expediente de expulsión previo."}, {"lvl": "avanzado", "q": "En la denegación de entrada en frontera, ¿qué marca se estampa en el pasaporte del extranjero?", "opts": ["Ningún sello, el pasaporte no se manipula", "Un sello de entrada tachado con una cruz de tinta indeleble negra", "Un sello rojo con la leyenda 'denegado'", "Se retiene el pasaporte de forma permanente"], "a": 1, "exp": "Sello de entrada tachado con cruz de tinta indeleble negra, y permanencia en instalaciones fronterizas máx. 72h."}, {"lvl": "avanzado", "q": "Si el regreso tras denegación de entrada se retrasa más de 72 horas, ¿quién decide el lugar de internamiento?", "opts": ["La Delegación del Gobierno, directamente y sin intervención judicial", "El Juez de Instrucción, en lugares sin carácter penitenciario dotados de servicios sociales, jurídicos y sanitarios", "El Ministerio del Interior, mediante resolución motivada", "No cabe internamiento en este supuesto, en ningún caso"], "a": 1, "exp": "El Juez de Instrucción determina el lugar; no tiene carácter penitenciario."}, {"lvl": "medio", "q": "¿Qué costes de la expulsión corren, con carácter prioritario, a cargo del empleador sancionado?", "opts": ["Corren siempre a cargo del Estado, sin excepción alguna", "Los costes de la expulsión, seguidos por el extranjero con medios económicos, y en su defecto se informa al consulado", "Corren siempre a cargo del Estado español, con independencia del empleador", "Corren exclusivamente a cargo de la empresa transportista"], "a": 1, "exp": "Orden de responsabilidad económica: empleador sancionado → extranjero con medios → consulado."}, {"lvl": "medio", "q": "¿Qué garantías deben respetarse si se prorroga, aplaza o suspende una expulsión?", "opts": ["Únicamente el derecho a intérprete, sin más garantías", "Unidad familiar, atención sanitaria urgente, tratamiento básico de enfermedades, educación básica de menores y protección de personas vulnerables", "Únicamente el derecho a intérprete durante el procedimiento", "Únicamente la asistencia letrada, sin otras garantías adicionales"], "a": 1, "exp": "Garantías mínimas listadas expresamente en el manual para estos supuestos."}, {"lvl": "avanzado", "q": "¿Qué ocurre con la ejecución de la expulsión si el extranjero solicita protección internacional?", "opts": ["Se ejecuta igualmente la expulsión, sin demora alguna", "Se suspende hasta que la solicitud sea inadmitida o resuelta", "Se anula automáticamente la resolución de expulsión", "No influye en absoluto en la tramitación del expediente"], "a": 1, "exp": "La solicitud de protección internacional suspende la ejecución de la expulsión hasta su resolución."}, {"lvl": "medio", "q": "Cuando la devolución no puede ejecutarse en el plazo de 72 horas, ¿qué medida cabe solicitar?", "opts": ["La expulsión sustitutiva automática, sin trámite adicional", "La medida de internamiento en CIE prevista para los expedientes de expulsión", "La expulsión automática, sin necesidad de trámite alguno", "El indulto administrativo de la infracción cometida"], "a": 1, "exp": "Se aplica analógicamente la medida de internamiento prevista para la expulsión."}, {"lvl": "basico", "q": "¿Cuál es el plazo de salida para la denegación en frontera según e zo de 'denegación de autorización para permanecer'?", "opts": ["Únicamente a la denegación de visado de entrada", "Cuando se dejan de cumplir los requisitos de entrada, estancia, residencia u otra situación de permanencia, y a la denegación de sus prórrogas", "Únicamente a los procedimientos que afectan a MENA", "Únicamente a las víctimas de violencia de género"], "a": 1, "exp": "Ámbito de aplicación de este supuesto de salida obligatoria."}, {"lvl": "avanzado", "q": "¿Cuál es el plazo de salida en la denegación de prórroga de estancia de corta duración sin visado?", "opts": ["De 7 a 30 días", "Antes del fin de estancia o no más de 72 horas", "15 días fijos, sin margen de graduación", "De forma inmediata en todo caso"], "a": 1, "exp": "Denegación de prórroga de estancia: antes del fin de la estancia o máximo 72 horas."}, {"lvl": "avanzado", "q": "¿Qué plazo fija el CP (art. 89) para la expulsión judicial por sustitución de pena de prisión, y cuál es la práctica habitual?", "opts": ["El CP no fija plazo; habitualmente 15 días", "Fija siempre un plazo de 30 días", "Fija un plazo de 72 horas", "Fija siempre un máximo improrrogable de 30 días"], "a": 0, "exp": "El Código Penal no fija plazo expreso; en la práctica se maneja habitualmente 15 días."}, {"lvl": "avanzado", "q": "¿Cuál es el plazo de salida en la expulsión o devolución administrativa por infracciones graves/muy graves o entrada ilegal, si se concede plazo?", "opts": ["De forma inmediata en todo caso", "De 7 a 30 días", "1 mes fijo, sin margen de graduación", "15 días fijos, sin margen de graduación"], "a": 1, "exp": "Expulsión/devolución administrativa: 7-30 días si se concede plazo."}, {"lvl": "avanzado", "q": "¿Hasta cuántos días puede prorrogarse excepcionalmente una expulsión administrativa si se dispone de medios económicos suficientes?", "opts": ["Hasta 30 días", "Hasta 60 días", "Hasta 90 días en casos excepcionales", "No cabe prórroga alguna en ningún caso"], "a": 2, "exp": "Prórroga excepcional de l // =====================================================================
// ESTADO DE LA APP
// =====================================================================
let state = {
  view: 'home',
  sessionId: null,
  carilla: null,
  questions: [],
  qIndex: 0,
  correct: 0,
  wrongList: []
};
let bestScores = {};

const app = document.getElementById('app');

function totalQuestionsInSession(sess){
  return sess.carillas.reduce((sum,c)=> sum + (bank[c] ? bank[c].length : 0), 0);
}

function testKey(sessionId, carilla){
  return sessionId + '_' + carilla;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

// =====================================================================
// RENDER: HOME
// =====================================================================
function renderHome(){
  state.view='home';
  const totalQ = Object.values(bank).reduce((s,arr)=>s+arr.length,0);
  let html = `
  <div class="card">
    <h2>⚠ Verificación legal (revisada 13/07/2026)</h2>
    <div class="warn">
      <b>RD 240/2007</b> (régimen comunitario): su última modificación consolidada sigue siendo el <b>RD 987/2015</b> (BOE 9/11/2015); no se ha detectado ninguna reforma posterior. Contenido vigente tal cual aparece en el manual.
    </div>
    <div class="warn red">
      <b>⚠ Dato actualizado — RD 1155/2024 (Reglamento LOEX) modificado por el RD 316/2026, de 14 de abril (BOE, en vigor desde el 16/04/2026):</b> el manual transcrito NO incluye esta reforma, posterior a su redacción. Afecta sobre todo a dos puntos de las carillas 74 y 75:<br><br>
      • Se añaden <b>dos nuevos tipos de arraigo</b> (disposiciones adicionales 20ª y 21ª del Reglamento): <i>arraigo para solicitantes de protección internacional</i> (para quienes pidieron protección internacional antes del 1/1/2026) y <i>arraigo extraordinario</i> (para quienes ya estaban en España antes del 1/1/2026), ambos con solicitud hasta el 30/06/2026 — además de los 5 tipos de arraigo que sí recoge tu manual (sociolaboral, social, socioformativo, familiar y de 2ª oportunidad).<br><br>
      • Se ajusta el art. 97 del Reglamento sobre residencia por vínculo familiar con español: los hijos mayores de 18 años y los ascendientes directos pueden ahora solicitar la autorización desde dentro de España, con habilitación provisional para trabajar durante la tramitación.<br><br>
      El resto del Reglamento (incluido el Título XIV, infracciones y régimen sancionador — Tema 11 completo) <b>no se ha visto modificado</b> por este RD 316/2026, según la propia exposición de motivos de la norma. Este banco de preguntas se basa fielmente en el contenido de tu manual (que sigue siendo válido); las dos notas anteriores son un aviso informativo para que sepas que existe contenido adicional no cubierto por tus apuntes, no una corrección de las preguntas.
    </div>
    <div class="warn">
      <b>LO 4/2000</b> (ley orgánica): no se ha detectado ninguna reforma de rango orgánico posterior a las ya incorporadas en el reglamento vigente.
    </div>
    <div class="warn red">
      <b>Sobre las "preguntas de examen oficial":</b> se han localizado y verificado <b>13 preguntas</b> procedentes de exámenes reales de oposiciones de Policía Nacional (Escala Básica y, en un caso señalado, Escala Ejecutiva) cuyo contenido corresponde a estas 12 carillas, contrastadas una a una contra el texto del manual. Están redactadas con palabras propias (no copiadas literalmente) y marcadas como <span class="qOficial" style="margin:0">EXAMEN OFICIAL</span> dentro del test, indicando año y convocatoria cuando la fuente lo confirma, o "convocatoria histórica" cuando la fuente no especifica el año con certeza. No se ha inventado ninguna atribución.<br><br>
      <b>Sobre la cobertura:</b> este banco contiene <b>${totalQ} preguntas</b> repartidas en las 12 carillas, generadas a partir de cada dato, cifra, plazo y matiz localizado en tus dos documentos, más las 13 preguntas oficiales verificadas. Es la cobertura más exhaustiva posible sobre el contenido transcrito — pero ningún banco finito puede garantizarte matemáticamente el 100% frente a un examen con formulaciones nuevas. Trátalo como el "mapa completo" del contenido, no como una promesa de infalibilidad.
    </div>
  </div>
  <div class="card">
    <h2>📅 Elige una sesión de estudio</h2>
    <div class="sessionGrid">`;
  sessions.forEach(s=>{
    const tq = totalQuestionsInSession(s);
    const doneTests = s.carillas.filter(c=>bestScores[testKey(s.id,c)]).length;
    html += `<div class="sessCard" onclick="renderSessionDetail('${s.id}')">
      ${doneTests ? `<div class="bestscore">✓ ${doneTests}/${s.carillas.length} tests</div>` : ''}
      <b>${s.label} (${s.id})</b>
      <div class="meta">Carillas ${s.carillas.join(', ')}<br>${s.desc}</div>
      <span class="stat">${tq} preguntas · 2 tests (1 por carilla)</span>
    </div>`;
  });
  html += `</div></div>`;
  app.innerHTML = html;
}

// =====================================================================
// RENDER: DETALLE DE SESIÓN (elegir test — uno por carilla)
// =====================================================================
function renderSessionDetail(id){
  state.view = 'sessionDetail';
  state.sessionId = id;
  const sess = sessions.find(s=>s.id===id);
  let html = `
  <div class="quizBar">
    <button class="back" onclick="renderHome()">← Sesiones</button>
    <span>${sess.label} (${sess.id})</span>
    <span></span>
  </div>
  <div class="card">
    <h2>${sess.label}</h2>
    <p style="color:var(--muted);font-size:.9rem">${sess.desc}</p>
    <p style="font-size:.85rem;color:var(--muted);font-family:sans-serif">Cada carilla tiene su propio test independiente, con únicamente las preguntas de esa carilla.</p>
    <div class="testGrid">`;
  sess.carillas.forEach(cNum=>{
    const n = bank[cNum] ? bank[cNum].length : 0;
    const best = bestScores[testKey(id,cNum)];
    const title = carillaTitles[cNum] || ('Carilla ' + cNum);
    html += `<div class="testCard" onclick="startTest('${id}',${cNum})">
      ${best ? `<div class="bestscore">✓ ${best.correct}/${best.total}</div>` : ''}
      <b>Test — Carilla ${cNum}</b>
      <div class="meta">${title.replace(/^Carilla \d+ — /,'')}</div>
      <span class="stat">${n} preguntas</span>
    </div>`;
  });
  html += `</div></div>`;
  app.innerHTML = html;
}

// =====================================================================
// INICIAR TEST (una única carilla)
// =====================================================================
function startTest(sessionId, carilla){
  let qList = (bank[carilla]||[]).map(qd=>({carilla, qd}));
  shuffle(qList);
  state = {view:'quiz', sessionId, carilla, questions:qList, qIndex:0, correct:0, wrongList:[]};
  renderQuiz();
}

// =====================================================================
// RENDER: QUIZ (una pregunta a la vez)
// =====================================================================
function renderQuiz(){
  const sess = sessions.find(s=>s.id===state.sessionId);
  const total = state.questions.length;
  const item = state.questions[state.qIndex];
  const pct = Math.round((state.qIndex/total)*100);

  let html = `
  <div class="quizBar">
    <button class="back" onclick="renderSessionDetail(state.sessionId)">← ${sess.label}</button>
    <span>Carilla ${state.carilla} · Pregunta ${state.qIndex+1}/${total}</span>
    <span>✔ ${state.correct}</span>
  </div>
  <div class="progressBarOuter"><div class="progressBarInner" style="width:${pct}%"></div></div>
  <div class="card">
    <span class="qCarilla">Carilla ${item.carilla}</span>
    ${item.qd.oficial ? `<span class="qOficial">🏛 EXAMEN OFICIAL — ${item.qd.oficial}</span>` : ''}
    <span class="level ${item.qd.lvl==='basico'?'lvl-basico':item.qd.lvl==='medio'?'lvl-medio':'lvl-avanzado'}">${item.qd.lvl==='basico'?'NIVEL BÁSICO':item.qd.lvl==='medio'?'NIVEL MEDIO':'NIVEL AVANZADO / REBUSCADO'}</span>
    <p class="enun">${item.qd.q}</p>
    <div class="opts" id="optsDiv"></div>
    <div class="explain" id="explainDiv"></div>
    <button class="nextBtn" id="nextBtn" onclick="nextQuestion()">Siguiente pregunta →</button>
  </div>`;
  app.innerHTML = html;

  const optsDiv = document.getElementById('optsDiv');
  const explainDiv = document.getElementById('explainDiv');
  const nextBtn = document.getElementById('nextBtn');

  const order = shuffle([0,1,2,3].slice(0, item.qd.opts.length));
  const correctPos = order.indexOf(item.qd.a);

  order.forEach((originalIndex, displayIndex)=>{
    const optText = item.qd.opts[originalIndex];
    const b = document.createElement('button');
    b.className='opt';
    b.textContent = String.fromCharCode(65+displayIndex) + ') ' + optText;
    b.onclick = ()=>{
      const allOpts = optsDiv.querySelectorAll('.opt');
      allOpts.forEach(o=>o.classList.add('disabled'));
      if(displayIndex === correctPos){
        b.classList.add('correct');
        state.correct++;
      } else {
        b.classList.add('incorrect');
        allOpts[correctPos].classList.add('correct');
        state.wrongList.push(item);
      }
      explainDiv.innerHTML = `<b>Explicación:</b> ${item.qd.exp}` + (item.qd.update ? `<div class="updateNote">⚠ <b>Dato actualizado:</b> ${item.qd.update}</div>` : '');
      explainDiv.classList.add('show');
      nextBtn.classList.add('show');
      nextBtn.textContent = (state.qIndex+1 < total) ? 'Siguiente pregunta →' : 'Ver resumen final →';
      document.querySelector('.quizBar span:last-child').textContent = `✔ ${state.correct}`;
    };
    optsDiv.appendChild(b);
  });
}

function nextQuestion(){
  state.qIndex++;
  if(state.qIndex < state.questions.length){
    renderQuiz();
  } else {
    bestScores[testKey(state.sessionId, state.carilla)] = {correct: state.correct, total: state.questions.length};
    renderSummary();
  }
}

// =====================================================================
// RENDER: RESUMEN
// =====================================================================
function renderSummary(){
  const sess = sessions.find(s=>s.id===state.sessionId);
  const total = state.questions.length;
  const pct = Math.round((state.correct/total)*100);
  let html = `
  <div class="quizBar">
    <button class="back" onclick="renderSessionDetail(state.sessionId)">← ${sess.label}</button>
    <span>Carilla ${state.carilla} · Resumen</span>
    <span></span>
  </div>
  <div class="card">
    <div class="summaryBig">
      <div class="pct">${state.correct}/${total} (${pct}%)</div>
      <div class="sub">Aciertos en el test de la Carilla ${state.carilla} (${sess.label})</div>
    </div>`;
  if(state.wrongList.length){
    html += `<div class="reviewList"><b style="font-family:sans-serif;color:var(--gold)">Preguntas falladas — revísalas antes de repetir:</b>`;
    state.wrongList.forEach(item=>{
      html += `<div class="reviewItem"><b>C${item.carilla}:</b> ${item.qd.q}<br><span style="color:var(--muted)">Correcta: ${item.qd.opts[item.qd.a]}</span></div>`;
    });
    html += `</div>`;
  } else {
    html += `<p style="text-align:center;color:#8fe3b5;font-family:sans-serif">¡Pleno! Has acertado todas las preguntas de este test.</p>`;
  }
  html += `<div class="btnRow">
      <button class="secondary" onclick="startTest('${state.sessionId}', ${state.carilla})">Repetir este test</button>
      <button class="primary" onclick="renderSessionDetail('${state.sessionId}')">Volver a ${sess.label}</button>
    </div>
  </div>`;
  app.innerHTML = html;
}

// iniciar
renderHome();
</script>
</body>
</html>
