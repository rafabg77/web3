<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CNP Oposición — 117 preguntas de examen: T9 · Seguridad Privada · T14">
<title>CNP · Preguntas de Examen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════
   TOKENS
   Fondo: blanco cálido casi imperceptible
   Respuesta correcta: verde institucional profundo
   Respuesta incorrecta: rojo sello
   T9: azul CNP (marino)    SP: violeta   T14: teal
   ══════════════════════════════════════════ */
:root{
  --bg:#F6F5F1;
  --surface:#FFFFFF;
  --surface-2:#F0EFEB;
  --border:#E2E0D8;
  --border-2:#CCCAB9;
  --text:#1A1A1A;
  --text-2:#4A4945;
  --text-3:#888680;
  --ok:#1A6E3C;
  --ok-bg:#EAF5EE;
  --ok-border:#A8D5B8;
  --bad:#B92A2A;
  --bad-bg:#FDEFEF;
  --bad-border:#F0AAAA;
  --t9:#1A4F8B;   --t9-bg:rgba(26,79,139,0.08);   --t9-dot:#1A4F8B;
  --sp:#5E3D9E;   --sp-bg:rgba(94,61,158,0.08);   --sp-dot:#5E3D9E;
  --t14:#1B6B6B;  --t14-bg:rgba(27,107,107,0.08);  --t14-dot:#1B6B6B;
  --r:10px; --r-lg:16px; --r-xl:22px;
  --sh:0 2px 8px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.04);
  --sh-lg:0 8px 32px rgba(0,0,0,0.10), 0 0 0 1px rgba(0,0,0,0.04);
  --tr:0.18s cubic-bezier(0.4,0,0.2,1);
  --tr-spring:0.4s cubic-bezier(0.16,1,0.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  line-height:1.55;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ══ BARRA PROGRESS SEGMENTADA (arriba) ══ */
#meterWrap{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:none;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:10px 16px 10px;
}
#meterMeta{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;font-weight:600;letter-spacing:.04em;
  color:var(--text-3);text-transform:uppercase;
  margin-bottom:6px;
}
#meterTrack{
  display:flex;gap:2px;height:6px;border-radius:100px;overflow:hidden;
}
.meter-seg{
  flex:1;border-radius:100px;
  background:var(--border);
  transition:background var(--tr);
}
.meter-seg.t9.done{ background:var(--t9); }
.meter-seg.sp.done{ background:var(--sp); }
.meter-seg.t14.done{ background:var(--t14); }
.meter-seg.current.t9{ background:var(--t9);opacity:.5; }
.meter-seg.current.sp{ background:var(--sp);opacity:.5; }
.meter-seg.current.t14{ background:var(--t14);opacity:.5; }

/* ══ CONTENEDOR PRINCIPAL ══ */
main{
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;padding:24px 16px 48px;
}
.view{ width:100%;max-width:640px; }

/* ══ INTRO / PORTADA ══ */
#introView{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;
  min-height:100vh;
  gap:0;
}
.intro-logo{
  width:52px;height:52px;border-radius:14px;
  background:var(--t9);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:20px;
  box-shadow:0 4px 16px rgba(26,79,139,0.25);
}
.intro-logo svg{ fill:white; }
.intro-title{
  font-size:clamp(26px,5vw,34px);font-weight:800;
  letter-spacing:-0.025em;line-height:1.2;
  text-align:center;
  color:var(--text);
  margin-bottom:6px;
}
.intro-sub{
  font-size:14px;color:var(--text-3);
  text-align:center;margin-bottom:32px;
}
.topic-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;width:100%;margin-bottom:24px;
}
.topic-card{
  background:var(--surface);
  border:2px solid var(--border);
  border-radius:var(--r-lg);
  padding:16px 12px;
  cursor:pointer;
  transition:all var(--tr);
  text-align:center;
  user-select:none;
  outline:none;
}
.topic-card .n{
  font-size:26px;font-weight:800;letter-spacing:-0.03em;
  margin-bottom:4px;color:var(--text-3);
  transition:color var(--tr);
}
.topic-card .l{
  font-size:10px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--text-3);
  transition:color var(--tr);
}
.topic-card.active.t9{ border-color:var(--t9);background:var(--t9-bg); }
.topic-card.active.t9 .n{ color:var(--t9); }
.topic-card.active.t9 .l{ color:var(--t9); }
.topic-card.active.sp{ border-color:var(--sp);background:var(--sp-bg); }
.topic-card.active.sp .n{ color:var(--sp); }
.topic-card.active.sp .l{ color:var(--sp); }
.topic-card.active.t14{ border-color:var(--t14);background:var(--t14-bg); }
.topic-card.active.t14 .n{ color:var(--t14); }
.topic-card.active.t14 .l{ color:var(--t14); }
.topic-card:focus-visible{ box-shadow:0 0 0 3px rgba(26,79,139,0.35); }
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 28px;border-radius:var(--r-lg);
  font-family:inherit;font-size:15px;font-weight:700;
  cursor:pointer;border:none;outline:none;
  transition:all var(--tr);
  text-decoration:none;
}
.btn:focus-visible{ box-shadow:0 0 0 3px rgba(26,79,139,0.35); }
.btn-primary{
  background:var(--t9);color:#fff;
  box-shadow:0 2px 12px rgba(26,79,139,0.3);
  width:100%;
}
.btn-primary:hover{ background:#153E70;box-shadow:0 4px 20px rgba(26,79,139,0.4); }
.btn-primary:active{ transform:scale(0.98); }

/* ══ QUIZ VIEW ══ */
#quizView{ display:none;padding-top:72px; }
#quizView.active{ display:block; }

#qcard{
  background:var(--surface);
  border-radius:var(--r-xl);
  box-shadow:var(--sh-lg);
  overflow:hidden;
  animation:slideIn var(--tr-spring) both;
}
@keyframes slideIn{
  from{opacity:0;transform:translateY(18px) scale(0.98);}
  to{opacity:1;transform:none;}
}

.qcard-header{
  padding:16px 20px 14px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
}
.q-tag{
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:6px;
}
.q-tag.t9{ background:var(--t9-bg);color:var(--t9); }
.q-tag.sp{ background:var(--sp-bg);color:var(--sp); }
.q-tag.t14{ background:var(--t14-bg);color:var(--t14); }
#qPosLabel{
  font-size:12px;font-weight:600;color:var(--text-3);
  white-space:nowrap;
}

.qcard-body{ padding:24px 24px 20px; }
#qText{
  font-family:'Lora',Georgia,serif;
  font-size:17px;font-weight:500;line-height:1.65;
  color:var(--text);
  margin-bottom:22px;
}

#qOpts{ display:flex;flex-direction:column;gap:8px; }
.opt{
  display:flex;align-items:flex-start;gap:12px;
  width:100%;text-align:left;
  background:var(--surface-2);
  border:1.5px solid var(--border);
  border-radius:var(--r);
  padding:13px 14px;
  cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:500;line-height:1.5;
  color:var(--text);
  transition:all var(--tr);
  outline:none;
  position:relative;overflow:hidden;
}
.opt:focus-visible{ box-shadow:0 0 0 3px rgba(26,79,139,0.3); }
.opt:not(:disabled):hover{
  border-color:var(--border-2);
  background:var(--surface);
  box-shadow:var(--sh);
}
.opt:not(:disabled):active{ transform:scale(0.99); }
.opt-letter{
  flex-shrink:0;
  width:22px;height:22px;
  border-radius:6px;
  background:var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--text-2);
  transition:all var(--tr);
  margin-top:1px;
}
.opt-text{ flex:1; }
.opt-icon{
  flex-shrink:0;margin-left:auto;
  opacity:0;transition:opacity var(--tr);
  color:var(--text-3);margin-top:2px;
}

/* Estados de respuesta */
.opt.correct{
  background:var(--ok-bg);
  border-color:var(--ok-border);
  color:var(--ok);
}
.opt.correct .opt-letter{ background:var(--ok);color:#fff; }
.opt.correct .opt-icon{ opacity:1;color:var(--ok); }
.opt.wrong{
  background:var(--bad-bg);
  border-color:var(--bad-border);
  color:var(--bad);
}
.opt.wrong .opt-letter{ background:var(--bad);color:#fff; }
.opt.wrong .opt-icon{ opacity:1;color:var(--bad); }
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-5px);}
  40%{transform:translateX(5px);}
  60%{transform:translateX(-4px);}
  80%{transform:translateX(4px);}
}
.opt.shake{ animation:shake 0.38s ease; }

/* Feedback + explicación */
.feedback-row{
  display:none;align-items:center;gap:8px;
  margin:16px 0 0;
  padding:11px 14px;
  border-radius:var(--r);
  font-size:14px;font-weight:600;
}
.feedback-row.show{ display:flex; }
.feedback-row.ok{ background:var(--ok-bg);color:var(--ok); }
.feedback-row.bad{ background:var(--bad-bg);color:var(--bad); }
.feedback-icon{ font-size:16px;flex-shrink:0; }

.q-exp{
  display:none;
  margin-top:12px;
  padding:14px 16px;
  background:var(--surface-2);
  border-left:3px solid var(--border-2);
  border-radius:0 var(--r) var(--r) 0;
  font-size:13px;line-height:1.65;color:var(--text-2);
}
.q-exp.show{ display:block; }
.q-exp b{ color:var(--text);font-weight:700; }

.qcard-actions{
  display:none;
  padding:16px 24px 20px;
  border-top:1px solid var(--border);
}
.qcard-actions.show{ display:flex;justify-content:flex-end; }

.btn-next{
  background:var(--t9);color:#fff;
  padding:10px 22px;
  border-radius:var(--r);
  font-size:14px;font-weight:700;
  border:none;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:7px;
  transition:all var(--tr);outline:none;
}
.btn-next:hover{ background:#153E70; }
.btn-next:focus-visible{ box-shadow:0 0 0 3px rgba(26,79,139,0.35); }
.btn-next svg{ transition:transform var(--tr); }
.btn-next:hover svg{ transform:translateX(3px); }

/* Foot score */
#footScore{
  text-align:center;margin-top:14px;
  font-size:12px;color:var(--text-3);font-weight:500;
}

/* ══ EMPTY MSG ══ */
#emptyMsg{
  display:none;text-align:center;padding:60px 20px;
}
#emptyMsg.show{ display:block; }
#emptyMsg p{ color:var(--text-2);margin-bottom:20px; }

/* ══ RESULT VIEW ══ */
#resultView{ display:none;padding-top:40px; }
#resultView.active{ display:block; }

.res-card{
  background:var(--surface);
  border-radius:var(--r-xl);
  box-shadow:var(--sh-lg);
  overflow:hidden;
  animation:slideIn var(--tr-spring) both;
}
.res-top{
  padding:36px 28px 28px;text-align:center;
  border-bottom:1px solid var(--border);
}
#resGrade{
  font-size:64px;font-weight:800;letter-spacing:-0.04em;
  line-height:1;
  color:var(--t9);margin-bottom:4px;
}
#resMsg{ font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px; }
#resSub{ font-size:13px;color:var(--text-3); }
.res-bar-wrap{
  width:100%;height:6px;background:var(--border);
  border-radius:100px;margin:20px 0 0;overflow:hidden;
}
#resBar{
  height:100%;border-radius:100px;
  background:linear-gradient(90deg,var(--t14),var(--t9));
  width:0;transition:width 0.8s cubic-bezier(0.16,1,0.3,1);
}
.res-stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-bottom:1px solid var(--border);
}
.stat{
  padding:20px 16px;text-align:center;
  border-right:1px solid var(--border);
}
.stat:last-child{ border-right:none; }
.stat-n{ font-size:28px;font-weight:800;letter-spacing:-0.03em; }
.stat-n.ok{ color:var(--ok); }
.stat-n.bad{ color:var(--bad); }
.stat-n.neutral{ color:var(--text-2); }
.stat-l{ font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin-top:2px; }
.res-actions{
  padding:20px 24px;
  display:flex;flex-direction:column;gap:10px;
}
.btn-res{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 20px;border-radius:var(--r);
  font-family:inherit;font-size:14px;font-weight:700;
  cursor:pointer;border:1.5px solid transparent;
  transition:all var(--tr);outline:none;
}
.btn-res:focus-visible{ box-shadow:0 0 0 3px rgba(26,79,139,0.35); }
.btn-res-primary{
  background:var(--t9);color:#fff;border-color:var(--t9);
}
.btn-res-primary:hover{ background:#153E70; }
.btn-res-primary:disabled{ opacity:.45;cursor:not-allowed; }
.btn-res-secondary{
  background:transparent;color:var(--text-2);border-color:var(--border);
}
.btn-res-secondary:hover{ background:var(--surface-2);border-color:var(--border-2); }

/* ══ NOTICE ══ */
#notice{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  padding:9px 18px;border-radius:100px;
  font-size:13px;font-weight:600;
  background:var(--text);color:var(--bg);
  opacity:0;pointer-events:none;
  transition:all 0.25s;
  z-index:200;white-space:nowrap;
  box-shadow:0 4px 16px rgba(0,0,0,0.2);
}
#notice.show{ opacity:1;transform:translateX(-50%) translateY(0); }

/* ══ KEYBOARD HINT ══ */
.kbd-hint{
  display:flex;align-items:center;justify-content:center;gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
  font-size:11px;color:var(--text-3);
}
kbd{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--surface-2);border:1px solid var(--border-2);
  border-radius:5px;padding:1px 6px;
  font-family:inherit;font-size:10px;font-weight:700;
  color:var(--text-2);
}

/* ══ RESPONSIVE ══ */
@media(max-width:500px){
  .topic-grid{ grid-template-columns:1fr; }
  .qcard-body{ padding:18px 16px 14px; }
  #qText{ font-size:15px; }
  .qcard-actions{ padding:12px 16px 16px; }
  .res-top{ padding:24px 20px 20px; }
}

/* ══ REDUCED MOTION ══ */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:0.001ms!important;transition-duration:0.001ms!important; }
}
</style>
</head>
<body>

<!-- BARRA SEGMENTADA -->
<div id="meterWrap" role="progressbar" aria-label="Progreso del test">
  <div id="meterMeta">
    <span>Pregunta <b id="meterPos">1</b> de <b id="meterTotal">—</b></span>
    <span>✓ <b id="meterScore">0</b> aciertos</span>
  </div>
  <div id="meterTrack"></div>
</div>

<main>

<!-- ══ PORTADA ══ -->
<div id="introView" class="view">
  <div class="intro-logo" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 28 28"><path d="M14 2L5 7v8c0 5.25 3.85 10.15 9 11.35C19.15 25.15 23 20.25 23 15V7L14 2z"/></svg>
  </div>
  <h1 class="intro-title">Preguntas CNP</h1>
  <p class="intro-sub">117 preguntas · T9 · Seguridad Privada · T14</p>
  <div class="topic-grid" id="topicGrid" role="group" aria-label="Selección de temas"></div>
  <button class="btn btn-primary" id="startBtn">Empezar test</button>
  <div class="kbd-hint" style="margin-top:16px;">
    <span><kbd>1</kbd>–<kbd>4</kbd> responder</span>
    <span><kbd>Enter</kbd> siguiente</span>
  </div>
</div>

<!-- ══ QUIZ ══ -->
<div id="quizView" class="view" aria-live="polite">
  <div id="qcard" role="main">
    <div class="qcard-header">
      <span id="qTag" class="q-tag"></span>
      <span id="qPosLabel" aria-label="posición actual"></span>
    </div>
    <div class="qcard-body">
      <p id="qText" role="heading" aria-level="2"></p>
      <div id="qOpts" role="group" aria-label="Opciones de respuesta"></div>
      <div id="feedbackRow" class="feedback-row" aria-live="assertive" role="status"></div>
      <div id="qExp" class="q-exp"></div>
    </div>
    <div id="qActions" class="qcard-actions">
      <button class="btn-next" id="nextBtn" aria-label="Siguiente pregunta">
        Siguiente
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
  <p id="footScore" aria-live="polite"></p>
</div>

<!-- ══ SIN PREGUNTAS ══ -->
<div id="emptyMsg" class="view" role="alert">
  <p>No hay preguntas disponibles con la selección actual.</p>
  <button class="btn btn-primary" id="emptyBackBtn" style="max-width:240px;">Volver a la portada</button>
</div>

<!-- ══ RESULTADO ══ -->
<div id="resultView" class="view" role="main" aria-label="Resultado del test">
  <div class="res-card">
    <div class="res-top">
      <div id="resGrade">—%</div>
      <div id="resMsg">—</div>
      <div id="resSub">—</div>
      <div class="res-bar-wrap"><div id="resBar"></div></div>
    </div>
    <div class="res-stats">
      <div class="stat"><div class="stat-n ok" id="resCorrect">—</div><div class="stat-l">Correctas</div></div>
      <div class="stat"><div class="stat-n bad" id="resWrong">—</div><div class="stat-l">Incorrectas</div></div>
      <div class="stat"><div class="stat-n neutral" id="resTotal">—</div><div class="stat-l">Total</div></div>
    </div>
    <div class="res-actions">
      <button class="btn-res btn-res-primary" id="reviewWrongBtn">Repasar fallos</button>
      <button class="btn-res btn-res-secondary" id="restartBtn">Nuevo test completo</button>
      <button class="btn-res btn-res-secondary" id="changeSetBtn">Cambiar temas</button>
    </div>
  </div>
</div>

</main>

<div id="notice" aria-live="assertive" role="status"></div>

<script>
const QS = [
  // ── T9 ──
  {
    t:"t9",
    q:"El art. 104 CE establece que las FCS están bajo dependencia del Gobierno. ¿Cuál de los siguientes aspectos NO recoge expresamente dicho artículo?",
    opts:["Misión de proteger el libre ejercicio de los derechos y libertades","Garantizar la seguridad ciudadana","Una LO determinará las funciones y principios básicos de actuación","Los principios de jerarquía y subordinación dentro de las FCS"],
    a:3,
    e:"El art. 104 CE solo establece: dependencia del Gobierno, misión (proteger DDLL y garantizar SC) y remisión a LO para funciones y principios. Los principios de jerarquía y subordinación los recoge la LO 2/1986, no la CE."
  },
  {
    t:"t9",
    q:"La seguridad pública es competencia exclusiva del Estado (art. 1 LO 2/1986). ¿A quién corresponde su mantenimiento?",
    opts:["Al Ministerio del Interior","Al Gobierno de la Nación","Al Secretario de Estado de Seguridad","A las FCSE conjuntamente"],
    a:1,
    e:"Art. 1 LO 2/1986: la seguridad pública es competencia exclusiva del Estado; su mantenimiento corresponde al Gobierno de la Nación. Las CCAA y Corporaciones Locales participan en ese mantenimiento."
  },
  {
    t:"t9",
    q:"Respecto a la Guardia Civil, ¿de qué ministerios depende en tiempo de paz?",
    opts:["Solo del Ministerio del Interior","Solo del Ministerio de Defensa","Del Ministerio del Interior (funciones) y del Ministerio de Defensa (misiones militares y régimen de personal)","Del Ministerio del Interior y de la Secretaría de Estado de Seguridad"],
    a:2,
    e:"La GC en tiempo de paz depende del MI para funciones de seguridad y del MD para misiones militares y régimen de personal. En guerra o estado de sitio pasa solo al MD."
  },
  {
    t:"t9",
    q:"¿Cuáles son las CCAA que tienen cuerpo de policía propio conforme a la LO 2/1986?",

    t:"sp",
    q:"¿Con qué autorización opera un buque bajo bandera española en aguas de grave riesgo cuando lleva Vigilantes de Seguridad armados?",
    opts:["Requiere autorización judicial específica para cada viaje","Está incluido en los supuestos de servicio con armas de la Ley 5/2014, sin autorización adicional por viaje","Requiere acuerdo entre el MI y el Ministerio de Defensa","Solo se autoriza con carácter de emergencia, nunca como servicio regular"],
    a:1,
    e:"Art. 40 Ley 5/2014: la vigilancia de buques bajo bandera española en aguas con GRAVE RIESGO para personas o bienes es uno de los supuestos legales de servicio con armas. No requiere autorización judicial por viaje; es una actividad contemplada en la ley, sujeta a los requisitos generales de la Ley 5/2014."
  }
];

// ══════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════
const TOPICS = {
  t9:  { label: 'LO 2/1986 (T9)',    short: 'T9'  },
  sp:  { label: 'Seguridad Privada', short: 'SP'  },
  t14: { label: 'LO 4/2015 (T14)',   short: 'T14' }
};
const TOTAL = QS.length;

let state = {
  selectedTopics: new Set(['t9', 'sp', 't14']),
  queue: [],
  pos: 0,
  answers: new Array(TOTAL).fill(null),
  reviewMode: false
};

function topicCount(t){ return QS.filter(q => q.t === t).length; }

// ══════════════════════════════════════
//  PORTADA
// ══════════════════════════════════════
function renderTopicGrid(){
  const grid = document.getElementById('topicGrid');
  grid.innerHTML = Object.keys(TOPICS).map(t => `
    <div class="topic-card active ${t}" data-t="${t}" tabindex="0" role="checkbox" aria-checked="true">
      <div class="n">${topicCount(t)}</div>
      <div class="l">${TOPICS[t].label}</div>
    </div>
  `).join('');
  grid.querySelectorAll('.topic-card').forEach(card => {
    const t = card.dataset.t;
    const toggle = () => {
      if(state.selectedTopics.has(t)){
        if(state.selectedTopics.size === 1){ showNotice('Deja al menos un tema activo'); return; }
        state.selectedTopics.delete(t);
      } else {
        state.selectedTopics.add(t);
      }
      card.classList.toggle('active');
      card.setAttribute('aria-checked', state.selectedTopics.has(t));
    };
    card.addEventListener('click', toggle);
    card.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
  });
}

document.getElementById('startBtn').addEventListener('click', () => startQuiz(false));
document.getElementById('changeSetBtn').addEventListener('click', goToIntro);
document.getElementById('emptyBackBtn').addEventListener('click', goToIntro);

function goToIntro(){
  document.getElementById('quizView').style.display = 'none';
  document.getElementById('resultView').classList.remove('active');
  document.getElementById('emptyMsg').classList.remove('show');
  document.getElementById('introView').style.display = 'flex';
  document.getElementById('meterWrap').style.display = 'none';
}

// ══════════════════════════════════════
//  BUILD QUEUE
// ══════════════════════════════════════
function buildQueue(filterWrongOnly){
  return QS.map((_,i) => i).filter(i => {
    if(!state.selectedTopics.has(QS[i].t)) return false;
    if(filterWrongOnly){
      const a = state.answers[i];
      return a !== null && a.chosen !== QS[i].a;
    }
    return true;
  });
}

function startQuiz(reviewWrongOnly){
  state.reviewMode = reviewWrongOnly;
  state.queue = buildQueue(reviewWrongOnly);
  if(!reviewWrongOnly) state.answers = new Array(TOTAL).fill(null);
  state.pos = 0;

  const introEl = document.getElementById('introView');
  const quizEl  = document.getElementById('quizView');
  const resEl   = document.getElementById('resultView');
  const emptyEl = document.getElementById('emptyMsg');

  introEl.style.display = 'none';
  resEl.classList.remove('active');

  if(state.queue.length === 0){
    quizEl.style.display = 'none';
    emptyEl.classList.add('show');
    document.getElementById('meterWrap').style.display = 'none';
    return;
  }

  emptyEl.classList.remove('show');
  quizEl.style.display = 'block';
  document.getElementById('meterWrap').style.display = 'block';

  buildMeter();
  renderCurrentQuestion();
}

// ══════════════════════════════════════
//  METER
// ══════════════════════════════════════
function buildMeter(){
  const track = document.getElementById('meterTrack');
  track.innerHTML = state.queue.map(qi =>
    `<div class="meter-seg ${QS[qi].t}" data-qi="${qi}"></div>`
  ).join('');
  document.getElementById('meterTotal').textContent = state.queue.length;
  updateMeter();
}

function updateMeter(){
  document.querySelectorAll('.meter-seg').forEach((seg,i) => {
    const qi = Number(seg.dataset.qi);
    seg.classList.remove('current','done');
    if(state.answers[qi] !== null) seg.classList.add('done');
    if(i === state.pos) seg.classList.add('current');
  });
  document.getElementById('meterPos').textContent = Math.min(state.pos+1, state.queue.length);
  const correct = state.answers.filter((a,i) => a!==null && a.chosen===QS[i].a).length;
  document.getElementById('meterScore').textContent = correct;
  document.getElementById('footScore').innerHTML = `Aciertos acumulados: <b>${correct}</b>`;
}

// ══════════════════════════════════════
//  RENDER PREGUNTA
// ══════════════════════════════════════
function renderCurrentQuestion(){
  const qi   = state.queue[state.pos];
  const item = QS[qi];

  const tagEl = document.getElementById('qTag');
  tagEl.textContent = TOPICS[item.t].label;
  tagEl.className   = 'q-tag ' + item.t;
  document.getElementById('qPosLabel').textContent = `${state.pos+1} / ${state.queue.length}`;
  document.getElementById('qText').textContent = item.q;

  const optsEl = document.getElementById('qOpts');
  optsEl.innerHTML = item.opts.map((o,oi) => `
    <button class="opt" id="opt${oi}" data-oi="${oi}" aria-label="Opción ${String.fromCharCode(65+oi)}: ${o}">
      <span class="opt-letter" aria-hidden="true">${String.fromCharCode(65+oi)}</span>
      <span class="opt-text">${o}</span>
      <span class="opt-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path class="icon-path" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </button>
  `).join('');
  optsEl.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => selectOption(qi, Number(btn.dataset.oi)));
  });

  const fb = document.getElementById('feedbackRow');
  fb.className = 'feedback-row';
  fb.innerHTML = '';
  document.getElementById('qExp').className = 'q-exp';
  document.getElementById('qExp').innerHTML = `<b>Explicación:</b> ${item.e}`;
  document.getElementById('qActions').className = 'qcard-actions';

  const prev = state.answers[qi];
  if(prev !== null) applyAnswerVisuals(qi, prev.chosen, prev.correct, false);

  // re-animar la tarjeta
  const card = document.getElementById('qcard');
  card.style.animation = 'none';
  requestAnimationFrame(() => { card.style.animation = ''; });

  updateMeter();
}

const CHECK_PATH = 'M3 9.5 7 13.5 15 4.5';
const CROSS_PATH = 'M4 4 L14 14 M14 4 L4 14';

function selectOption(qi, chosen){
  if(state.answers[qi] !== null) return;
  const correct = QS[qi].a;
  state.answers[qi] = { chosen, correct };
  applyAnswerVisuals(qi, chosen, correct, true);
  updateMeter();
}

function applyAnswerVisuals(qi, chosen, correct, animate){
  document.querySelectorAll('.opt').forEach((b,i) => {
    b.disabled = true;
    const path = b.querySelector('.icon-path');
    if(i === correct){
      b.classList.add('correct');
      path.setAttribute('d', CHECK_PATH);
    } else if(i === chosen){
      b.classList.add('wrong');
      path.setAttribute('d', CROSS_PATH);
      if(animate) b.classList.add('shake');
    }
  });

  const fb = document.getElementById('feedbackRow');
  const isRight = chosen === correct;
  fb.classList.add('show', isRight ? 'ok' : 'bad');
  fb.innerHTML = isRight
    ? '<span class="feedback-icon">✓</span> Correcto'
    : '<span class="feedback-icon">✗</span> Incorrecto — revisa la explicación';

  document.getElementById('qExp').classList.add('show');
  document.getElementById('qActions').classList.add('show');

  if(animate) showNotice(isRight ? 'Correcto' : 'Incorrecto');
}

document.getElementById('nextBtn').addEventListener('click', goNext);

function goNext(){
  if(state.pos + 1 >= state.queue.length){ showResult(); return; }
  state.pos++;
  renderCurrentQuestion();
}

// ══════════════════════════════════════
//  TECLADO
// ══════════════════════════════════════
document.addEventListener('keydown', e => {
  const quizEl = document.getElementById('quizView');
  if(quizEl.style.display !== 'block') return;
  const qi = state.queue[state.pos];
  if(['1','2','3','4'].includes(e.key) && state.answers[qi] === null){
    const btn = document.getElementById('opt' + (Number(e.key)-1));
    if(btn) btn.click();
  } else if((e.key==='Enter'||e.key==='ArrowRight') && state.answers[qi] !== null){
    e.preventDefault(); goNext();
  }
});

// ══════════════════════════════════════
//  RESULTADO
// ══════════════════════════════════════
function showResult(){
  document.getElementById('quizView').style.display = 'none';
  document.getElementById('meterWrap').style.display = 'none';
  document.getElementById('resultView').classList.add('active');

  const answered = state.queue.filter(i => state.answers[i] !== null);
  const correct  = answered.filter(i => state.answers[i].chosen === QS[i].a).length;
  const wrong    = answered.length - correct;
  const total    = state.queue.length;
  const pct      = total ? Math.round((correct/total)*100) : 0;

  document.getElementById('resGrade').textContent   = pct + '%';
  document.getElementById('resCorrect').textContent = correct;
  document.getElementById('resWrong').textContent   = wrong;
  document.getElementById('resTotal').textContent   = total;

  let msg, sub;
  if(pct >= 90){ msg='Dominio de élite'; sub='Rendimiento excepcional.'; }
  else if(pct >= 80){ msg='Nivel excelente'; sub='Superas el umbral con holgura.'; }
  else if(pct >= 65){ msg='Bien — repasa los fallos'; sub='Estás cerca. Refuerza los puntos débiles.'; }
  else if(pct >= 50){ msg='Nivel intermedio'; sub='Hay margen de mejora.'; }
  else { msg='Necesitas más estudio'; sub='Repite el bloque con más errores.'; }

  document.getElementById('resMsg').textContent = msg;
  document.getElementById('resSub').textContent = sub;

  const reviewBtn = document.getElementById('reviewWrongBtn');
  reviewBtn.disabled = wrong === 0;

  setTimeout(() => { document.getElementById('resBar').style.width = pct + '%'; }, 80);
}

document.getElementById('reviewWrongBtn').addEventListener('click', () => startQuiz(true));
document.getElementById('restartBtn').addEventListener('click',     () => startQuiz(false));

// ══════════════════════════════════════
//  NOTICE
// ══════════════════════════════════════
let noticeTimer;
function showNotice(msg){
  const n = document.getElementById('notice');
  n.textContent = msg;
  n.classList.add('show');
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => n.classList.remove('show'), 1600);
}

// ══════════════════════════════════════
//  INIT
// ══════════════════════════════════════
renderTopicGrid();
</script>
</body>
</html>
