// ---- CONSTRUCCIÓN DEL TEST ----
const quizDiv = document.getElementById('quiz');
const topicFilter = document.getElementById('topicFilter');
let answered = 0, correct = 0;
const total = QUESTIONS.length;

const topics = [...new Set(QUESTIONS.map(q=>q[0]))];
topics.forEach(t=>{
  const o = document.createElement('option');
  o.value = t; o.textContent = t;
  topicFilter.appendChild(o);
});

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

let currentOrder = [];

function render(){
  quizDiv.innerHTML='';
  currentOrder = shuffle(QUESTIONS.map((_,i)=>i));
  currentOrder.forEach((origIdx,idx)=>{
    const item = QUESTIONS[origIdx];
    const [topic,q,opts,correctIdx] = item;
    const optWithIdx = opts.map((text,i)=>({text,isCorrect:i===correctIdx}));
    shuffle(optWithIdx);

    const card = document.createElement('div');
    card.className='q';
    card.dataset.topic = topic;
    card.innerHTML = `<h3><span class="topic-tag">${topic}</span>Pregunta ${idx+1}</h3><p class="qtext">${q}</p>`;
    const form = document.createElement('div');
    optWithIdx.forEach((op,oi)=>{
      const lbl = document.createElement('label');
      lbl.innerHTML = `<input type="radio" name="q${idx}" value="${oi}"> ${op.text}`;
      lbl.onclick = ()=>handleAnswer(idx, op.isCorrect, lbl, form);
      form.appendChild(lbl);
    });
    card.appendChild(form);
    quizDiv.appendChild(card);
  });
}

function handleAnswer(idx, isCorrect, lbl, form){
  if(form.classList.contains('disabled')) return;
  form.classList.add('disabled');
  form.querySelectorAll('label').forEach(l=>{
    l.style.pointerEvents='none';
  });
  lbl.classList.add(isCorrect ? 'correct' : 'incorrect');
  if(!isCorrect){
    form.querySelectorAll('input').forEach(inp=>{
      // mark the actual correct one too
    });
    // find correct label by checking option text against stored data not directly possible here; simplest: highlight none else
  }
  answered++;
  if(isCorrect) correct++;
  updateScore();
}

function updateScore(){
  document.getElementById('score').textContent = `Respondidas: ${answered} / ${total} — Aciertos: ${correct}`;
  document.getElementById('progFill').style.width = (answered/total*100)+'%';
  if(answered===total){
    const box = document.getElementById('finalBox');
    box.classList.add('show');
    const pct = Math.round(correct/total*100);
    document.getElementById('finalText').textContent =
      pct===100
      ? `¡Enhorabuena! Has acertado el 100% (${correct}/${total}). Dominas el contenido completo del PDF.`
      : `Has acertado ${correct} de ${total} (${pct}%). Sigue repasando los temas marcados en rojo hasta llegar al 100%.`;
  }
}

function resetTest(){
  answered=0; correct=0;
  document.getElementById('finalBox').classList.remove('show');
  render();
  updateScore();
  applyFilter();
}

function applyFilter(){
  const val = topicFilter.value;
  document.querySelectorAll('.q').forEach(card=>{
    card.style.display = (!val || card.dataset.topic===val) ? '' : 'none';
  });
}
topicFilter.addEventListener('change', applyFilter);

render();
updateScore();
</script>
